const TRACKS = ['The Confidence Chant', 'Shook Ones Freestyle', 'The Spell of the East'];

const G = {

function layout() {

  if (PORTRAIT) { LW = 120; HITY = 880; TOPY = 560; GROUND = 500; HERO_X = 140; OPP_X = 400; CS = 0.7; }
  else { LW = TOUCH ? 96 : 64; HITY = 478; TOPY = 80; GROUND = 440; HERO_X = 150; OPP_X = 790; CS = 1; }
  LEFT = (W - LANES * LW) / 2;

layout();
addEventListener('resize', layout);

const rawNow = () => performance.now() / 1000;

const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- audio ---------- */

    v.setUint32(24, 22050, true); v.setUint32(28, 44100, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);

  } catch (e) { ac = null; }
}
function kick(t) {

  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
  g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);

function noise(t, dur, freq, vol, type) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur);

function bass(t, freq) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(g).connect(master); o.start(t); o.stop(t + 0.32);
}
function blip(freq, dur, vol) {
  if (!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 1.6, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);

function thunder() { if (ac) { noise(ac.currentTime, 1.2, 400, 0.9, 'lowpass'); kick(ac.currentTime); } }
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const CHORDS = [
  { root: 38, keys: [53, 57, 60, 64], lead: [62, 65, 69, 72, 74, 76] },
  { root: 43, keys: [53, 59, 62, 64], lead: [67, 71, 74, 76, 77, 79] },
  { root: 36, keys: [52, 55, 59, 62], lead: [64, 67, 71, 72, 74, 76] },
  { root: 45, keys: [55, 61, 64, 65], lead: [64, 67, 69, 73, 76, 77] }

function keys(t, notes, dur, vol) {
  notes.forEach((m, k) => {
    for (const [type, det, v] of [['sine', 0, 1], ['triangle', 5, 0.35]]) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = mtof(m); o.detune.value = det + k;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * v * 0.22, t + 0.012);

    }
  });
}
function upright(t, m, vol) {
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = 'triangle'; o.frequency.value = mtof(m); f.type = 'lowpass'; f.frequency.value = 600;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  o.connect(f).connect(g).connect(bus); o.start(t); o.stop(t + 0.36);
}
function guitar(t, m, dur, vol, oct) {
  const f = mtof(m);
  const lp = ac.createBiquadFilter(), g = ac.createGain();

const SCALES = [
  [57, 59, 60, 62, 64, 65, 67, 69],
  [55, 57, 59, 60, 62, 64, 65, 67],
  [55, 57, 59, 60, 62, 64, 67, 69],
  [57, 59, 61, 62, 64, 65, 67, 69]

/* ---------- game flow ---------- */

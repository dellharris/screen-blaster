<script>
'use strict';

// ─── Canvas setup ─────────────────────────────────────────────────────────────
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
const VW = 900, VH = 500;
let scale = 1, offX = 0, offY = 0;

function resize() {
  // visualViewport is accurate on iOS Safari — always use it when available
  const vv = window.visualViewport;
  const w = vv ? vv.width  : window.innerWidth;
  const h = vv ? vv.height : window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width  = w + 'px';
  cv.style.height = h + 'px';
  // Pin canvas to top-left of visual viewport (handles iOS address bar shifts)
  if (vv) {
    cv.style.left = vv.offsetLeft + 'px';
    cv.style.top  = vv.offsetTop  + 'px';
  }
  scale = Math.min(cv.width / VW, cv.height / VH);
  offX  = (cv.width  - VW * scale) / 2;
  offY  = (cv.height - VH * scale) / 2;
}

// Fire resize immediately, then again after iOS finishes animating the rotation
function onOrientationChange() {
  resize();
  setTimeout(resize, 100);
  setTimeout(resize, 300);
  setTimeout(resize, 600);
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', onOrientationChange);
// visualViewport fires its own resize event — most reliable on iOS
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize',  resize);
  window.visualViewport.addEventListener('scroll',  resize);
}
resize();

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  'sierra_side_a','sierra_side_b','sierra_backq_a','sierra_backq_b',
  'sierra_squat',
  'naomi_front', 'naomi_back', 'naomi_side', 'naomi_backq',
  'naomi_front_a','naomi_front_b','naomi_back_a','naomi_back_b',
  'naomi_side_a','naomi_side_b','naomi_backq_a','naomi_backq_b',
  'naomi_squat',
  'police',
];

function processSprite(key) {
  const img = IMG[key];
  if (!img || !img.complete || img.naturalWidth === 0) {
    SPR[key] = img || null;
    return;
  }
  // Resize to working resolution
  const maxH = 512;
  const ratio = img.naturalWidth / img.naturalHeight;
  const h = maxH, w = Math.max(1, Math.round(h * ratio));
  const oc = document.createElement('canvas');
  oc.width = w; oc.height = h;
  const gc = oc.getContext('2d');
  gc.drawImage(img, 0, 0, w, h);
  try {
    const id = gc.getImageData(0, 0, w, h);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const bright = Math.max(d[i], d[i+1], d[i+2]);
      if (bright < 8)       d[i+3] = 0;
      else if (bright < 20) d[i+3] = Math.floor((bright - 8) / 12 * 255);
    }
    gc.putImageData(id, 0, 0);
    SPR[key] = oc;
  } catch(e) {
    // getImageData blocked — use raw image, screen blend will handle bg
    SPR[key] = img;
  }
}

function loadImg(k, src) {
  const i = new Image();
  i.onload  = () => { IMG[k] = i; if (CHAR_KEYS.includes(k)) processSprite(k); };
  i.onerror = () => { IMG[k] = null; SPR[k] = null; };
  i.src = src;
}

// ─── Perspective floor definition ─────────────────────────────────────────────
// Calibrated against the Miami alley backdrop:
// Vanishing point ~center at y≈52%, left wall converges harder than right.
const FL = {
  topY: VH * 0.52,  botY: VH * 0.97,   // floor y range (far → near)
  topXL: VW * 0.36, topXR: VW * 0.64,  // alley mouth at far end (narrow)
  botXL: VW * 0.00, botXR: VW * 1.00,  // full width at near camera
};

// World → screen. wx=0..1 (left→right on floor), wz=0..1 (far→near = small→big)
function w2s(wx, wz) {
  const lx = lerp(FL.topXL, FL.botXL, wz);
  const rx = lerp(FL.topXR, FL.botXR, wz);
  const sy = lerp(FL.topY,  FL.botY,  wz);
  return { x: lx + wx * (rx - lx), y: sy };
}

// Depth scale: far=0.22 (tiny at vanishing point), near=1.20 (fills frame)
function dScale(wz) { return lerp(0.22, 1.20, wz); }

// Overhead squish: simulates camera looking down at ~40° angle
const SQUISH = 0.66;

// ─── PWA install detection ────────────────────────────────────────────────────
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;
const IS_STANDALONE = window.navigator.standalone === true ||
                      window.matchMedia('(display-mode: standalone)').matches;
const NEEDS_INSTALL = IS_IOS && !IS_STANDALONE;

// ─── Game phases ──────────────────────────────────────────────────────────────
const PH = { INSTALL:-1, INTRO:0, TITLE:1, DLG:2, CUTSCENE:3, CROSSFADE:4, PLAY:5, CAUGHT:6, WIN:7, WIN_DLG:8, END:9 };
let phase = NEEDS_INSTALL ? PH.INSTALL : PH.INTRO;
let pulse = 0, dlgIdx = 0, winDlgIdx = 0, endTimer = 0;
let crossfadeTimer = 0;
const CROSSFADE_DUR = 1.2;

// ─── Cutscene video ───────────────────────────────────────────────────────────
const VID  = document.getElementById('cutscene-video');
const MUS  = document.getElementById('bg-music');
const LVID = document.getElementById('latch-video');
const IVID = document.getElementById('intro-video');
let musicMuted = false;

// ─── Intro video ──────────────────────────────────────────────────────────────
// Plays as the very first thing — muted so autoplay works on mobile.
// On end (or tap) → fade to title screen.
let introVideoFade = 0;  // 0=video fully visible, 1=title fully visible

function playIntroVideo() {
  IVID.style.display = 'block';
  IVID.style.opacity = 1;
  IVID.currentTime = 0;
  IVID.play().catch(() => { endIntroVideo(); });
}

function endIntroVideo() {
  // Fade the intro video out, canvas title fades in
  IVID.pause();
  const fadeOut = setInterval(() => {
    introVideoFade = Math.min(1, introVideoFade + 0.06);
    IVID.style.opacity = 1 - introVideoFade;
    if (introVideoFade >= 1) {
      clearInterval(fadeOut);
      IVID.style.display = 'none';
      IVID.style.opacity = 1;
      introVideoFade = 0;
      phase = PH.TITLE;
      startMusic();
    }
  }, 16);
}

IVID.addEventListener('ended', endIntroVideo);

// ─── Latch scene system ───────────────────────────────────────────────────────
// Add clips here as the game grows. played=false means not yet triggered.
const LATCH_CLIPS = [
  { id: 'squat', src: 'assets/latch_squat.mp4', played: false },
  // future clips go here: { id: 'key_found', src: 'assets/latch_key.mp4', played: false },
];
let latchCallback = null;

function playLatch(clipId, onEnd) {
  const clip = LATCH_CLIPS.find(c => c.id === clipId);
  if (!clip || clip.played) { onEnd && onEnd(); return; }
  clip.played = true;
  latchCallback = onEnd;
  LVID.src = clip.src;
  LVID.style.display = 'block';
  LVID.currentTime = 0;
  LVID.play().catch(() => { endLatch(); });
}

function endLatch() {
  LVID.pause();
  LVID.style.display = 'none';
  LVID.src = '';
  const cb = latchCallback;
  latchCallback = null;
  cb && cb();
}

LVID.addEventListener('ended', endLatch);

function triggerCrouch() {
  const wasStanding = !P.crouch;
  P.crouch = !P.crouch;
  // Play transition sequence
  P.transSeq   = wasStanding ? NAOMI_CROUCH_IN : NAOMI_CROUCH_OUT;
  P.transFrame = 0;
  P.transTimer = 0;
  if (wasStanding) {
    playLatch('squat', () => { P.crouch = true; P.crouchLerp = 1; });
  }
}

function startMusic() {
  MUS.volume = 0.7;
  MUS.play().catch(() => {});
}
function toggleMute() {
  musicMuted = !musicMuted;
  MUS.muted = musicMuted;
}

function playCutscene() {
  phase = PH.CUTSCENE;
  VID.style.display = 'block';
  VID.currentTime = 0;
  VID.play().catch(() => { chainLatch(); });
}

// Run video ends → chain into latch video seamlessly
function chainLatch() {
  VID.pause();
  VID.style.display = 'none';
  LVID.style.display = 'block';
  LVID.currentTime = 0;
  LVID.play().catch(() => { endCutscene(); });
}

function endCutscene() {
  LVID.pause();
  LVID.style.display = 'none';
  startGame();
  P.crouch = true; P.crouchLerp = 1;
  P.wx = 0.62; P.wz = 0.65; P.renderWx = 0.62; P.renderWz = 0.65;
  P.lastMvx = 0; P.lastMvz = 1;
  NPC.wx = 0.80; NPC.wz = 0.62; NPC.renderWx = 0.80; NPC.renderWz = 0.62;
  NPC.lastMvx = 0; NPC.lastMvz = 1;
  phase = PH.CROSSFADE;
  crossfadeTimer = 0;
}

function buildGrain() {
  grainCv = document.createElement('canvas');
  grainCv.width = VW; grainCv.height = VH;
  const gc = grainCv.getContext('2d');
  const id = gc.createImageData(VW, VH);

    const v = (Math.random() * 255) | 0;
    id.data[i] = id.data[i+1] = id.data[i+2] = v;
    id.data[i+3] = (Math.random() * 28) | 0;
  }
  gc.putImageData(id, 0, 0);
}

// Physical obstacle footprints

const OBSTACLES = [
  { id:'binA', wxMin:0.50, wxMax:0.74, wzMin:0.39, wzMax:0.59 },
  { id:'binB', wxMin:0.72, wxMax:1.00, wzMin:0.26, wzMax:0.48 }, // wall-sealed right edge
];

// Slide character around obstacles — called after every movement update
function resolveObstacles(newWx, newWz, prevWx, prevWz) {
  for (const o of OBSTACLES) {
    if (newWx >= o.wxMin && newWx <= o.wxMax &&
        newWz >= o.wzMin && newWz <= o.wzMax) {
      const prevInX = prevWx >= o.wxMin && prevWx <= o.wxMax;
      if (!prevInX) {
        // Entered from the side — slide along X edge, keep Z
        newWx = prevWx < (o.wxMin + o.wxMax) * 0.5 ? o.wxMin - 0.005 : o.wxMax + 0.005;
      } else {
        // Entered from front/back — slide along Z edge, keep X
        newWz = prevWz < (o.wzMin + o.wzMax) * 0.5 ? o.wzMin - 0.005 : o.wzMax + 0.005;
      }
    }
  }
  return { wx: newWx, wz: newWz };
}

// ─── State flags ──────────────────────────────────────────────────────────────
let isCaught = false, catchFlash = 0;

// ─── Input ────────────────────────────────────────────────────────────────────
const JOY = { on:false, id:null, sx:0, sy:0, dx:0, dy:0, r:58 };
let crouchId = null, runId = null, mouseDrag = false;
const KEYS = {};

function toV(touch) {
  const r = cv.getBoundingClientRect();
  return {
    x: ((touch.clientX - r.left) * (cv.width  / r.width)  - offX) / scale,
    y: ((touch.clientY - r.top)  * (cv.height / r.height) - offY) / scale,
  };
}

const CROUCH_BTN = { cx: VW-64, cy: VH-64, r: 46 };
const RUN_BTN    = { cx: VW-64, cy: VH-172, r: 38 };  // above Stay Low
function isCrouchBtn(x, y) { return Math.hypot(x-CROUCH_BTN.cx, y-CROUCH_BTN.cy) < CROUCH_BTN.r; }
function isRunBtn(x, y)    { return Math.hypot(x-RUN_BTN.cx,    y-RUN_BTN.cy)    < RUN_BTN.r;    }
function isMuteBtn(x, y)   { return x > VW-110 && x < VW-16 && y > 8 && y < 44; }
function isJoyZone(x, y)   { return x < VW*0.45 && y > VH*0.42; }

function handleTap() {
  if (phase === PH.INSTALL)   { return; }
  if (phase === PH.INTRO)     { endIntroVideo(); return; }  // tap skips intro video
  if (phase === PH.TITLE)     { phase = PH.DLG; return; }
  if (phase === PH.DLG)       { dlgIdx++; if (dlgIdx >= DLG.length) playCutscene(); return; }
  if (phase === PH.CUTSCENE)  { chainLatch(); return; }
  if (phase === PH.CROSSFADE) { crossfadeTimer = CROSSFADE_DUR; return; }
  if (phase === PH.WIN_DLG)   { winDlgIdx++; if (winDlgIdx >= WIN_DLG.length) { phase = PH.END; endTimer = 0; } return; }
  if (phase === PH.END)       { resetGame(); return; }
  if (phase === PH.CAUGHT)    { resetGame(); return; }
}

cv.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const p = toV(t);
    if (phase === PH.PLAY) {
      if (isCrouchBtn(p.x, p.y) && crouchId === null) { crouchId = t.identifier; triggerCrouch(); }
      else if (isRunBtn(p.x, p.y) && runId === null)  { runId = t.identifier; P.running = true; }
      else if (isMuteBtn(p.x, p.y)) { toggleMute(); }
      else if (isPhoneBtn(p.x, p.y)) { PHONE_OPEN = !PHONE_OPEN; if (PHONE_OPEN) INVENTORY.open = false; }
      else if (handlePhoneMenuTap(p.x, p.y)) { /* handled */ }
      else if (p.x > VW-116 && p.x < VW-16 && p.y > 56 && p.y < 96) { INVENTORY.open = !INVENTORY.open; if (INVENTORY.open) PHONE_OPEN = false; }
      else if (isJoyZone(p.x, p.y) && !JOY.on) {
        JOY.on = true; JOY.id = t.identifier;
        JOY.sx = p.x; JOY.sy = p.y; JOY.dx = JOY.dy = 0;
      }
    } else { handleTap(); }
  }
}, { passive: false });

cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== JOY.id) continue;
    const p = toV(t);
    const dx = p.x - JOY.sx, dy = p.y - JOY.sy;
    const d = Math.hypot(dx, dy) || 1, c = Math.min(d, JOY.r);
    JOY.dx = (dx / d) * (c / JOY.r);
    JOY.dy = (dy / d) * (c / JOY.r);
  }
}, { passive: false });

cv.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === JOY.id)    { JOY.on = false; JOY.id = null; JOY.dx = JOY.dy = 0; }
    if (t.identifier === crouchId)  crouchId = null;
    if (t.identifier === runId)     { runId = null; P.running = false; }
  }
}, { passive: false });

cv.addEventListener('mousedown', e => {
  const r = cv.getBoundingClientRect();
  const x = ((e.clientX-r.left)*(cv.width/r.width)-offX)/scale;
  const y = ((e.clientY-r.top)*(cv.height/r.height)-offY)/scale;
  if (phase === PH.PLAY) {
    if (isCrouchBtn(x,y)) { triggerCrouch(); return; }
    if (isRunBtn(x,y))    { P.running = true; return; }
    if (isMuteBtn(x,y))   { toggleMute(); return; }
    if (isPhoneBtn(x,y))  { PHONE_OPEN = !PHONE_OPEN; if (PHONE_OPEN) INVENTORY.open = false; return; }
    if (handlePhoneMenuTap(x,y)) return;
    if (x > VW-116 && x < VW-16 && y > 56 && y < 96) { INVENTORY.open = !INVENTORY.open; if (INVENTORY.open) PHONE_OPEN = false; return; }
    tryInteract();
    if (isJoyZone(x,y)) { mouseDrag=true; JOY.on=true; JOY.sx=x; JOY.sy=y; JOY.dx=JOY.dy=0; }
  } else handleTap();
});
cv.addEventListener('mouseup', () => { mouseDrag=false; JOY.on=false; JOY.dx=JOY.dy=0; P.running=false; });
cv.addEventListener('mousemove', e => {
  if (!mouseDrag) return;
  const r = cv.getBoundingClientRect();
  const x = ((e.clientX-r.left)*(cv.width/r.width)-offX)/scale;
  const y = ((e.clientY-r.top)*(cv.height/r.height)-offY)/scale;
  const dx=x-JOY.sx, dy=y-JOY.sy, d=Math.hypot(dx,dy)||1, c=Math.min(d,JOY.r);
  JOY.dx=(dx/d)*(c/JOY.r); JOY.dy=(dy/d)*(c/JOY.r);
});

window.addEventListener('keydown', e => {
  KEYS[e.key] = true;
  if ((e.key===' '||e.key==='c') && phase===PH.PLAY) triggerCrouch();
  if ((e.key==='e'||e.key==='E') && phase===PH.PLAY) tryInteract();
  if ((e.key==='Shift') && phase===PH.PLAY) P.running = true;
  if ((e.key==='b'||e.key==='B') && phase===PH.PLAY) INVENTORY.open = !INVENTORY.open;
  if (phase!==PH.PLAY) handleTap();
});
window.addEventListener('keyup', e => {
  KEYS[e.key]=false;
  if (e.key==='Shift') P.running = false;
});

// ─── Game control ─────────────────────────────────────────────────────────────
function startGame() {
  phase = PH.PLAY;
  // Girls start IN FRONT of bins (higher wz = closer to camera = visible on camera side)
  P.wx=0.62; P.wz=0.65; P.renderWx=0.62; P.renderWz=0.65;
  P.vwx=P.vwz=0; P.crouch=true; P.crouchLerp=1; P.det=0; P.catches=0;
  P.walkTimer=0; P.walkFrame=0; P.walkStep=0; P.moving=false; P.running=false;
  P.transSeq=null; P.transFrame=0; P.transTimer=0;
  P.sqIdleTimer=0; P.sqIdleActive=false; P.sqIdleFrame=0; P.sqIdleFrameTimer=0;
  P.lastMvx=0; P.lastMvz=1;
  NPC.wx=0.80; NPC.wz=0.62; NPC.renderWx=0.80; NPC.renderWz=0.62;
  NPC.targetWx=0.80; NPC.targetWz=0.62; NPC.crouchLerp=1;
  NPC.walkTimer=0; NPC.walkFrame=0; NPC.walkStep=0; NPC.moving=false;
  NPC.lastMvx=0; NPC.lastMvz=1;
  CAR.la=0; CAR.ldir=1; CAR.ft=0;
  isCaught=false; catchFlash=0;
}
function resetGame() {
  phase=PH.TITLE; pulse=0; dlgIdx=0; winDlgIdx=0; endTimer=0;
  LATCH_CLIPS.forEach(c => c.played = false);
  MISSION_DUMP.state='closed'; MISSION_DUMP.frame=0; MISSION_DUMP.timer=0;
  INVENTORY.items=[]; INVENTORY.open=false; INVENTORY.anim=0;
}

// ─── Update ───────────────────────────────────────────────────────────────────
function inCover() {
  for (const z of COVERS) {
    if (P.wx>=z.wxMin && P.wx<=z.wxMax && P.wz>=z.wzMin && P.wz<=z.wzMax) return true;
  }
  return false;
}

function inSpotlight() {
  // Car is at (CAR.wx, CAR.wz). Its light sweeps horizontally.
  const dwx = P.wx - (CAR.wx + CAR.la * 0.30);
  const dwz = P.wz - CAR.wz;
  // Must be "in front of" the car (higher wz = closer to camera)
  if (dwz < 0 || dwz > CAR.coneWz) return false;
  // Cone narrows toward car, widens toward camera proportional to depth
  const coneW = CAR.coneWx * (dwz / CAR.coneWz);
  return Math.abs(dwx) < coneW;
}

let lastTs = 0;
function update(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  pulse += dt;

  // Intro — play video, video's ended event handles transition to title
  if (phase === PH.INTRO) {
    playIntroVideo();
    phase = PH.TITLE; // prevent re-triggering; video runs independently
    return;
  }

  // Crossfade video → game
  if (phase === PH.CROSSFADE) {
    crossfadeTimer += dt;
    // Fade video opacity down
    VID.style.opacity = Math.max(0, 1 - crossfadeTimer / CROSSFADE_DUR);
    if (crossfadeTimer >= CROSSFADE_DUR) {
      VID.pause();
      VID.style.display = 'none';
      VID.style.opacity = 1;
      phase = PH.PLAY;
    }
    return;
  }

  // Win flash → win dialogue
  tickWinFlash(dt);

  // End card auto-replay after 8s
  if (phase === PH.END) {
    endTimer += dt;
    if (endTimer > 8) resetGame();
    return;
  }

  CAR.la += CAR.lspd * CAR.ldir * dt;
  if (Math.abs(CAR.la) > 1) CAR.ldir *= -1;
  CAR.ft += dt;

  // Sierra mirrors Naomi's crouch
  // No lateral weave when crouching — Sierra stays perfectly still beside Naomi
  const sideWeave = P.crouch ? 0 : Math.sin(pulse * 1.3) * 0.022;

  if (P.crouch) {
    // In front of bins, camera-facing side — Sierra to Naomi's right
    NPC.targetWx = clamp(P.wx + 0.18, 0.72, 0.92);
    NPC.targetWz = clamp(P.wz - 0.02, 0.58, 0.72);
  } else {
    // Running — Sierra leads slightly ahead-left
    NPC.targetWx = clamp(P.wx - 0.15 + sideWeave, 0.03, 0.90);
    NPC.targetWz = clamp(P.wz - 0.13, 0.02, 0.90);
  }

  const prevNx = NPC.wx, prevNz = NPC.wz;
  const npcSpeed = P.crouch ? 0.6 : P.running ? 3.5 : 2.0;
  NPC.wx = lerp(NPC.wx, NPC.targetWx, Math.min(1, dt * npcSpeed));
  NPC.wz = lerp(NPC.wz, NPC.targetWz, Math.min(1, dt * npcSpeed));
  // Resolve NPC obstacles too
  const npcRes = resolveObstacles(NPC.wx, NPC.wz, prevNx, prevNz);
  NPC.wx = npcRes.wx; NPC.wz = npcRes.wz;
  const ndx = NPC.wx - prevNx, ndz = NPC.wz - prevNz;
  const nmag = Math.hypot(ndx, ndz);
  if (nmag > 0.00003) { NPC.lastMvx = ndx / nmag; NPC.lastMvz = ndz / nmag; }
  else if (!P.crouch) { NPC.lastMvx = 0; NPC.lastMvz = 1; }

  // Player world-space movement from joystick
  let mx = 0, mz = 0;
  if (JOY.on) { mx = JOY.dx; mz = JOY.dy; }
  if (KEYS['ArrowLeft'] || KEYS['a']) mx -= 1;
  if (KEYS['ArrowRight']|| KEYS['d']) mx += 1;
  if (KEYS['ArrowUp']   || KEYS['w']) mz -= 1;
  if (KEYS['ArrowDown'] || KEYS['s']) mz += 1;

  const mag = Math.hypot(mx, mz) || 1;
  if (mx || mz) { mx /= mag; mz /= mag; P.lastMvx = mx; P.lastMvz = mz; }

  // Detect micro-step: pick sequence based on dominant input direction
  const inputMag = Math.hypot(mx, mz);
  if (inputMag > 0.05 && !P.crouch && !P.transSeq) {
    let seq = NAOMI_STEP_SEQ; // default: forward-facing shuffle
    if (mz < -0.4 && Math.abs(mz) > Math.abs(mx))      seq = NAOMI_STEP_BACK;
    else if (mx >  0.4 && Math.abs(mx) > Math.abs(mz)) seq = NAOMI_STEP_RIGHT;
    else if (mx < -0.4 && Math.abs(mx) > Math.abs(mz)) seq = NAOMI_STEP_LEFT;
    P.transSeq = seq; P.transFrame = 0; P.transTimer = 0;
  }

  // Tick Naomi's transition sequence
  if (P.transSeq) {
    P.transTimer += dt;
    const cur = P.transSeq[P.transFrame];
    if (P.transTimer >= cur.dur) {
      P.transTimer = 0;
      P.transFrame++;
      if (P.transFrame >= P.transSeq.length) P.transSeq = null;
    }
  }

  // Read Shift from KEYS too (held keyboard run)
  if (KEYS['Shift']) P.running = true;

  const spd = P.crouch ? 0.32 : P.running ? 1.0 : 0.52;  // crouch / run / walk
  const prevPx = P.wx, prevPz = P.wz;
  P.wx = clamp(P.wx + mx * P.wxSpeed * spd * dt, 0.02, 0.98);
  P.wz = clamp(P.wz + mz * P.wzSpeed * spd * dt, 0.01, 0.98);

  // Resolve player vs obstacles — slide around bins instead of stopping
  const pRes = resolveObstacles(P.wx, P.wz, prevPx, prevPz);
  P.wx = clamp(pRes.wx, 0.02, 0.98);
  P.wz = clamp(pRes.wz, 0.01, 0.98);

  // Smooth crouch interpolation — player and Sierra each independent
  P.crouchLerp   = lerp(P.crouchLerp,   P.crouch ? 1 : 0, Math.min(1, dt * 9));
  NPC.crouchLerp = lerp(NPC.crouchLerp, P.crouch ? 1 : 0, Math.min(1, dt * 9));

  // Smooth render positions — tiny lag makes motion feel organic
  P.renderWx = lerp(P.renderWx, P.wx, Math.min(1, dt * 14));
  P.renderWz = lerp(P.renderWz, P.wz, Math.min(1, dt * 14));
  NPC.renderWx = lerp(NPC.renderWx, NPC.wx, Math.min(1, dt * 14));
  NPC.renderWz = lerp(NPC.renderWz, NPC.wz, Math.min(1, dt * 14));

  // Idle phase ticks (breathing animation)
  P.idlePhase   = (P.idlePhase   + dt) % (Math.PI * 200);
  NPC.idlePhase = (NPC.idlePhase + dt) % (Math.PI * 200);

  // ─── Naomi squat idle fidget ───────────────────────────────────────────────
  const sqMoving = !!(mx || mz);
  if (P.crouch && !sqMoving && !P.transSeq && !P.sqIdleActive) {
    P.sqIdleTimer += dt;
    if (P.sqIdleTimer >= 6.0) {
      P.sqIdleActive = true; P.sqIdleFrame = 0; P.sqIdleFrameTimer = 0;
      P.sqIdleTimer = 0;
    }
  } else if (!P.crouch || sqMoving || P.transSeq) {
    P.sqIdleTimer = 0; P.sqIdleActive = false; P.sqIdleFrame = 0;
  }

  if (P.sqIdleActive) {
    P.sqIdleFrameTimer += dt;
    if (P.sqIdleFrameTimer >= NAOMI_SQUAT_IDLE[P.sqIdleFrame].dur) {
      P.sqIdleFrameTimer = 0;
      P.sqIdleFrame++;
      if (P.sqIdleFrame >= NAOMI_SQUAT_IDLE.length) {
        P.sqIdleActive = false; P.sqIdleFrame = 0; P.sqIdleTimer = 0;
      }
    }
  }

  // ─── Mission dumpster tick ────────────────────────────────────────────────
  if (MISSION_DUMP.state === 'opening') {
    MISSION_DUMP.timer += dt;
    const cur = OPENING_SEQ[MISSION_DUMP.frame];
    if (MISSION_DUMP.timer >= cur.dur) {
      MISSION_DUMP.timer = 0;
      MISSION_DUMP.frame++;
      if (MISSION_DUMP.frame >= OPENING_SEQ.length) {
        MISSION_DUMP.state = 'open_key';
        MISSION_DUMP.frame = 0;
      }
    }
  }
  // open_key: hold static on last opening frame — no looping animation

  // Inventory bag animation
  const bagOpen = INVENTORY.open;
  INVENTORY.anim = lerp(INVENTORY.anim, bagOpen ? 1 : 0, Math.min(1, dt * 10));

  // Walk animation tick — 3-frame cycle: neutral(0) → a(1) → neutral(0) → b(2)
  P.moving = !!(mx || mz);
  if (P.moving) {
    const fps = P.crouch ? 5.0 : P.running ? 13.0 : 7.0;  // crouch-walk at 5fps
    P.walkTimer += dt * fps;
    if (P.walkTimer >= 1) {
      P.walkTimer -= 1;
      if (P.running) {
        // Run: skip neutral frame — cycles a→b→a→b directly for bigger stride look
        P.walkStep = (P.walkStep + 1) % 2;
        P.walkFrame = P.walkStep === 0 ? 1 : 2;
      } else {
        // Walk: neutral between each stride — 0=neutral, 1=_a, 2=neutral, 3=_b
        P.walkStep = (P.walkStep + 1) % 4;
        P.walkFrame = [0, 1, 0, 2][P.walkStep];
      }
    }
  } else {
    P.walkTimer = 0; P.walkStep = 0; P.walkFrame = 0;
  }

  // NPC walk animation tick — use actual position change, not target distance
  // (target shifts every frame from sideWeave so distance-to-target is never zero)
  const npcActualMove = Math.hypot(NPC.wx - NPC.renderWx, NPC.wz - NPC.renderWz);
  NPC.moving = npcActualMove > 0.003;
  if (NPC.moving) {
    NPC.walkTimer += dt * 7.0;
    if (NPC.walkTimer >= 1) {
      NPC.walkTimer -= 1;
      NPC.walkStep = (NPC.walkStep + 1) % 4;
      NPC.walkFrame = [0, 1, 0, 2][NPC.walkStep];
    }
  } else {
    NPC.walkTimer = 0; NPC.walkStep = 0; NPC.walkFrame = 0;
  }

  // ─── Sierra gum idle animation ────────────────────────────────────────────
  const GUM_TRIGGER = 5.0;

  if (P.crouch && !NPC.moving && !NPC.gumActive) {
    NPC.idleTimer += dt;
    if (NPC.idleTimer >= GUM_TRIGGER) {
      NPC.gumActive = true; NPC.gumFrame = 0; NPC.gumFrameTimer = 0;
      NPC.idleTimer = 0;
    }
  } else if (!P.crouch || NPC.moving) {
    NPC.gumActive = false; NPC.gumFrame = 0; NPC.gumFrameTimer = 0;
    NPC.gumFade = 0; NPC.gumFading = false;
    NPC.idleTimer = 0;
  }

  if (NPC.gumActive) {
    NPC.gumFrameTimer += dt;
    if (NPC.gumFrameTimer >= GUM_SEQ[NPC.gumFrame].dur) {
      NPC.gumFrameTimer = 0;
      NPC.gumFrame++;
      if (NPC.gumFrame >= GUM_SEQ.length) {
        NPC.gumActive = false; NPC.gumFrame = 0; NPC.idleTimer = 0;
      }
    }
  }

  // Derive screen pos for this frame
  const sp = w2s(P.wx, P.wz);
  P.sx = sp.x; P.sy = sp.y;

  // Detection
  if (inSpotlight() && !inCover() && !isCaught) {
    P.det = Math.min(1, P.det + (P.crouch ? 0.25 : 1.0) * dt);
  } else {
    P.det = Math.max(0, P.det - 0.4 * dt);
  }

  if (P.det >= 1 && !isCaught) {
    isCaught = true; catchFlash = 1; P.det = 0; P.catches++;
    if (P.catches >= P.maxCatches) {
      setTimeout(() => { phase = PH.CAUGHT; }, 1400);
    } else {
      setTimeout(() => { isCaught = false; }, 1600);
    }
  }
  if (catchFlash > 0) catchFlash = Math.max(0, catchFlash - dt * 2.5);

  // Win
  if (P.wx >= WIN.wxMin && P.wx <= WIN.wxMax &&
      P.wz >= WIN.wzMin && P.wz <= WIN.wzMax) {
    phase = PH.WIN;
  }
}

// Trigger win dialogue after a brief WIN flash
let winFlashTimer = 0;
function tickWinFlash(dt) {
  if (phase !== PH.WIN) return;
  winFlashTimer += dt;
  if (winFlashTimer > 1.4) { phase = PH.WIN_DLG; winFlashTimer = 0; winDlgIdx = 0; }
}

// Patrol car spotlight cone drawn in world-perspective space
function drawSpotlight() {
  // Car screen position
  const cs = w2s(CAR.wx, CAR.wz);
  const ox = cs.x, oy = cs.y;

  // The light sweeps forward (toward near camera, in screen = downward)
  // Two boundary rays of the cone
  const nearWz = clamp(CAR.wz + CAR.coneWz, 0, 1);
  const sweep = CAR.la * 0.30;
  const lEdge = w2s(CAR.wx + sweep - CAR.coneWx * 0.85, nearWz);
  const rEdge = w2s(CAR.wx + sweep + CAR.coneWx * 0.85, nearWz);
  const mEdge = w2s(CAR.wx + sweep, nearWz);

  const g = cx.createRadialGradient(ox, oy, 0, mEdge.x, mEdge.y, 180);
  g.addColorStop(0, 'rgba(255,250,190,0.42)');
  g.addColorStop(0.5,'rgba(255,246,160,0.14)');
  g.addColorStop(1, 'rgba(255,240,130,0)');

  cx.save();
  cx.beginPath();
  cx.moveTo(ox, oy);
  cx.lineTo(lEdge.x, lEdge.y);
  cx.lineTo(rEdge.x, rEdge.y);
  cx.closePath();
  cx.fillStyle = g;
  cx.fill();
  cx.restore();
}

function drawCar() {
  const cs  = w2s(CAR.wx, CAR.wz);
  const s   = dScale(CAR.wz) * 3.0;
  const spr = SPR['police'] || IMG['police'];

  const baseW = 220, baseH = 120;
  const sw = baseW * s, sh = baseH * s * SQUISH;
  const x = cs.x, y = cs.y;

  cx.save();
  cx.translate(x, y);

  if (spr) {
    cx.scale(-1, 1);
    cx.drawImage(spr, -sw / 2, -sh, sw, sh);
    cx.scale(-1, 1);

    cx.fillStyle = '#111820';

  cx.beginPath();
  cx.ellipse(0, -sh * 0.82, sw * 0.25, sh * 0.18, 0, 0, Math.PI * 2);

}

// Draw a single dumpster at world position
function drawDumpster(wx, wz, scale2, spriteKey) {
  const key = spriteKey || 'dumpster';
  const img = IMG[key] || IMG['dumpster'];
  if (!img || !img.naturalWidth || !img.naturalHeight) return;
  const ar  = img.naturalWidth / img.naturalHeight;
  const ds  = w2s(wx, wz);
  const sc  = dScale(wz) * (scale2 || 2.0);
  const dh  = 220 * sc * SQUISH;
  if (!isFinite(dh) || !isFinite(ar)) return;
  cx.drawImage(img, ds.x - dh*ar*0.46, ds.y - dh*0.92, dh*ar, dh);
}

// Depth-sorted render: bins AND characters in one list so depth is always correct
function drawEntities() {
  const ents = [
    { type:'bin', wz: DUMP_B.wz, draw: () => drawDumpster(DUMP_B.wx, DUMP_B.wz, 1.4) },
    { type:'bin', wz: DUMP_A.wz, draw: () => {
      // Mission dumpster — show correct state sprite
      let sprKey = 'dumpster_closed';
      if (MISSION_DUMP.state === 'closed')     sprKey = 'dumpster_closed';
      if (MISSION_DUMP.state === 'opening')    sprKey = OPENING_SEQ[MISSION_DUMP.frame]?.key || 'dumpster_closed';
      if (MISSION_DUMP.state === 'open_key')   sprKey = 'dumpster_open_key_d';  // static hold
      if (MISSION_DUMP.state === 'open_empty') sprKey = 'dumpster_open_empty';
      drawDumpster(DUMP_A.wx, DUMP_A.wz, 1.4, sprKey);
    }},
    { type:'npc',    wz: NPC.renderWz, draw: () => {
      const gumSprKey = NPC.gumActive ? GUM_SEQ[NPC.gumFrame].key : null;
      // sqBoost=1.22 makes Sierra's squat match Naomi's visual size — gum/transition frames unaffected
      drawChar('sierra', NPC.renderWx, NPC.renderWz, NPC.lastMvx, NPC.lastMvz, NPC.walkFrame, P.crouch, NPC.crouchLerp, NPC.idlePhase, gumSprKey, 0, 1.22, NPC.moving);
    }},
    { type:'player', wz: P.renderWz,   draw: () => {
      drawPlayerDetectGlow();
      let naomiSprKey = P.transSeq ? P.transSeq[P.transFrame].key : null;
      if (!naomiSprKey && P.sqIdleActive) naomiSprKey = NAOMI_SQUAT_IDLE[P.sqIdleFrame].key;
      drawChar('naomi', P.renderWx, P.renderWz, P.lastMvx, P.lastMvz, P.walkFrame, P.crouch, P.crouchLerp, P.idlePhase, naomiSprKey, 0, undefined, P.moving);
    }},
  ];
  ents.sort((a, b) => a.wz - b.wz);
  for (const e of ents) e.draw();
}

// ─── Character rendering ──────────────────────────────────────────────────────
// Pick the right sprite key + flip flag based on movement direction and state
// walkFrame: 0=_a, 1=_b. crouch overrides to _squat.
function getSpriteKey(charKey, mvx, mvz, walkFrame, crouch, isMoving) {
  // Crouching idle → squat. Crouching + moving → walk frames (compressed by heightMul).
  if (crouch && !isMoving) return { k: charKey + '_squat', flip: mvx < -0.01 };

  const suf = !isMoving || walkFrame === 0 ? '' : walkFrame === 1 ? '_a' : '_b';
  if (!isMoving) return { k: charKey + '_front', flip: false };

  const goBack  = mvz < -0.01;
  const goFront = mvz >  0.01;
  const goRight = mvx >  0.01;
  const goLeft  = mvx < -0.01;

  if (goBack && goRight) return { k: charKey + '_backq' + suf, flip: false };
  if (goBack && goLeft)  return { k: charKey + '_backq' + suf, flip: true  };
  if (goBack)            return { k: charKey + '_back'  + suf, flip: false };
  if (goRight && !goFront && !goBack) return { k: charKey + '_side' + suf, flip: false };
  if (goLeft  && !goFront && !goBack) return { k: charKey + '_side' + suf, flip: true  };
  return { k: charKey + '_front' + suf, flip: goLeft };
}

function drawChar(key, wx, wz, mvx, mvz, walkFrame, crouch, crouchLerp, idlePhase, gumSprKey, gumFade, sqBoost, isMoving) {
  const sp  = w2s(wx, wz);
  const s   = dScale(wz);
  const crouchBinary = crouchLerp > 0.5;

  // Resolve sprites — pass explicit isMoving so direction vector doesn't fake movement
  const { k: sprKey, flip: baseFlip } = getSpriteKey(key, mvx, mvz, walkFrame, crouchBinary, !!isMoving);
  const baseDir = sprKey.replace(/_a$|_b$/, '');
  let spr = SPR[sprKey] || SPR[baseDir] || SPR[key+'_front'] || IMG[sprKey] || IMG[key+'_front'];

  // Active gum/transition sequence key overrides base sprite entirely.
  // Pre-oriented images (step_left is already mirrored) — suppress flip so no double-mirror.
  let flip = baseFlip;
  if (gumSprKey) {
    spr  = SPR[gumSprKey] || IMG[gumSprKey] || spr;
    flip = false;  // sequence images are pre-oriented, never re-flip them
  }

  const baseH = 360;
  const heightMul = lerp(1.0, 0.70, crouchLerp);
  // sqBoost only applies when showing the plain squat sprite — gum/transition frames stay untouched
  const boost = (!gumSprKey && crouchBinary && sqBoost) ? sqBoost : 1.0;
  const sh = baseH * s * SQUISH * heightMul * boost;
  const ar = spr ? (spr.width / spr.height) : 0.5;
  const sw = sh * ar;

  const breathAmp   = crouchBinary ? 0.8 : 1.6;
  const breathFreq  = crouchBinary ? 0.45 : 0.85;
  const breathY     = isMoving ? 0 : Math.sin(idlePhase * breathFreq) * breathAmp;
  const breathScale = 1;

  cx.save();
  cx.translate(sp.x, sp.y + breathY);
  cx.scale(breathScale, breathScale);

  // Shadow
  cx.globalAlpha = 0.35;
  cx.fillStyle = '#000';
  cx.beginPath();
  cx.ellipse(0, 6, sw * 0.28, Math.max(2, sh * 0.05), 0, 0, Math.PI * 2);
  cx.fill();
  cx.globalAlpha = 1;

  if (flip) cx.scale(-1, 1);
  if (spr) {
    cx.drawImage(spr, -sw/2, -sh, sw, sh);
  } else {
    cx.globalAlpha = 0.85;
    cx.fillStyle = key === 'naomi' ? '#a08070' : '#804040';
    cx.fillRect(-sw/2, -sh, sw, sh);
  }

  cx.restore();
}

// Detect outline glow when player is spotted
function drawPlayerDetectGlow() {
  if (P.det < 0.15) return;
  const sp = { x: P.sx, y: P.sy };
  const s  = dScale(P.wz);
  const glow = cx.createRadialGradient(sp.x, sp.y - 40*s*SQUISH, 0,
                                        sp.x, sp.y, 60*s);
  glow.addColorStop(0, `rgba(255,200,0,${P.det * 0.55})`);
  glow.addColorStop(1, 'transparent');
  cx.save();
  cx.globalAlpha = P.det;
  cx.fillStyle = glow;
  cx.beginPath();
  cx.ellipse(sp.x, sp.y - 40*s*SQUISH, 35*s, 50*s*SQUISH, 0, 0, Math.PI*2);
  cx.fill();
  cx.restore();
}

// ─── HUD ──────────────────────────────────────────────────────────────────────
function drawMinimap() {
  const mx=14, my=VH-104, mw=86, mh=76;
  cx.save();
  // Map background
  cx.globalAlpha = 0.9;
  cx.fillStyle='#06040e'; cx.strokeStyle='#ff2d78'; cx.lineWidth=1.5;
  cx.beginPath(); cx.roundRect(mx,my,mw,mh,5); cx.fill(); cx.stroke();

  // Draw perspective trapezoid on minimap
  cx.globalAlpha = 0.4; cx.strokeStyle='#334'; cx.lineWidth=0.7;
  const ms = mw - 8, md = mh - 8;
  function mapFloor(wx, wz) {
    return { x: mx+4 + wx*ms, y: my+4 + wz*md };
  }
  cx.beginPath();
  const tl=mapFloor(0,0), tr=mapFloor(1,0), bl=mapFloor(0,1), br=mapFloor(1,1);
  cx.moveTo(tl.x,tl.y); cx.lineTo(tr.x,tr.y); cx.lineTo(br.x,br.y); cx.lineTo(bl.x,bl.y); cx.closePath();
  cx.stroke();

  // WIN zone
  cx.globalAlpha = 0.6; cx.fillStyle='#00ff88';
  const wp = mapFloor(WIN.wxMin, WIN.wzMin);
  cx.fillRect(wp.x, wp.y, mw*WIN.wxMax*0.5, md*WIN.wzMax*0.4);

  // Patrol car
  cx.globalAlpha = 1; cx.fillStyle='#ffdd00';
  const cp = mapFloor(CAR.wx, CAR.wz);
  cx.beginPath(); cx.arc(cp.x, cp.y, 3, 0, Math.PI*2); cx.fill();

  // Sierra
  cx.fillStyle='#00ffcc';
  const np = mapFloor(NPC.wx, NPC.wz);
  cx.beginPath(); cx.arc(np.x, np.y, 2.5, 0, Math.PI*2); cx.fill();

  // Player
  cx.fillStyle='#ff2d78';
  const pp = mapFloor(P.wx, P.wz);
  cx.beginPath(); cx.arc(pp.x, pp.y, 3.5, 0, Math.PI*2); cx.fill();

  cx.restore();
}

function drawInteractPrompt() {
  const dist = Math.hypot(P.wx - MISSION_DUMP.wx, P.wz - MISSION_DUMP.wz);
  if (dist > MISSION_DUMP.interactRange) return;
  if (MISSION_DUMP.state === 'opening') return;

  const ds = w2s(MISSION_DUMP.wx, MISSION_DUMP.wz);
  const prompt = MISSION_DUMP.state === 'closed'     ? '[ E ]  Open' :
                 MISSION_DUMP.state === 'open_key'   ? '[ E ]  Take Key 🗝️' : null;
  if (!prompt) return;

  cx.save();
  cx.globalAlpha = 0.75 + Math.sin(pulse * 4) * 0.2;
  cx.font = 'bold 13px monospace';
  cx.textAlign = 'center';
  const tw = cx.measureText(prompt).width + 20;
  cx.fillStyle = '#0a0816'; cx.strokeStyle = '#00ffcc'; cx.lineWidth = 1.5;
  cx.beginPath(); cx.roundRect(ds.x - tw/2, ds.y - 120, tw, 28, 6); cx.fill(); cx.stroke();
  cx.fillStyle = '#00ffcc';

  cx.restore();
}

function drawJoystick() {
  if (!JOY.on) return;
  cx.save();
  const ox = JOY.sx, oy = JOY.sy, r = JOY.r;
  // Base plate
  cx.globalAlpha = 0.30;
  cx.fillStyle = '#0d0d20';
  cx.beginPath(); cx.arc(ox, oy, r, 0, Math.PI*2); cx.fill();
  // Outer ring
  cx.globalAlpha = 0.55;
  cx.strokeStyle = '#3a3a6a'; cx.lineWidth = 3;
  cx.beginPath(); cx.arc(ox, oy, r, 0, Math.PI*2); cx.stroke();
  // Inner ring
  cx.globalAlpha = 0.2;
  cx.strokeStyle = '#8888aa'; cx.lineWidth = 1;
  cx.beginPath(); cx.arc(ox, oy, r * 0.55, 0, Math.PI*2); cx.stroke();
  // Direction marks (Xbox notches at N/S/E/W)
  cx.globalAlpha = 0.35;
  cx.strokeStyle = '#6666aa'; cx.lineWidth = 2;
  [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy]) => {
    cx.beginPath();
    cx.moveTo(ox + dx*(r-16), oy + dy*(r-16));
    cx.lineTo(ox + dx*(r-6),  oy + dy*(r-6));
    cx.stroke();
  });
  // Thumbstick
  const kx = ox + JOY.dx*r, ky = oy + JOY.dy*r;
  const kr = 30;
  // Stick shadow
  cx.globalAlpha = 0.45;
  cx.fillStyle = '#000';
  cx.beginPath(); cx.arc(kx+2, ky+4, kr, 0, Math.PI*2); cx.fill();
  // Stick body gradient
  const sg = cx.createRadialGradient(kx-kr*0.3, ky-kr*0.3, 1, kx, ky, kr);
  sg.addColorStop(0,   '#7070c0');
  sg.addColorStop(0.45,'#282850');
  sg.addColorStop(1,   '#10101e');
  cx.globalAlpha = 0.92;
  cx.fillStyle = sg;
  cx.beginPath(); cx.arc(kx, ky, kr, 0, Math.PI*2); cx.fill();
  // Stick rim
  cx.globalAlpha = 0.6;
  cx.strokeStyle = '#5555aa'; cx.lineWidth = 2;
  cx.beginPath(); cx.arc(kx, ky, kr, 0, Math.PI*2); cx.stroke();
  // Specular glint
  cx.globalAlpha = 0.3;
  cx.fillStyle = '#aaaaff';
  cx.beginPath(); cx.ellipse(kx-kr*0.22, ky-kr*0.28, kr*0.35, kr*0.18, -0.5, 0, Math.PI*2); cx.fill();
  cx.restore();
}

// ─── Intro sequence ───────────────────────────────────────────────────────────
function drawIntro() {
  // Black base
  cx.fillStyle = '#000';
  cx.fillRect(0, 0, VW, VH);

  // Compute master alpha for fade in/out
  let alpha;
  if (introTimer < INTRO_IN) {
    alpha = introTimer / INTRO_IN;
  } else if (introTimer < INTRO_IN + INTRO_HOLD) {
    alpha = 1;
  } else {
    alpha = 1 - (introTimer - INTRO_IN - INTRO_HOLD) / INTRO_OUT;
  }
  alpha = Math.max(0, Math.min(1, alpha));

  cx.save();

  // ── Base image ──
  if (IMG['intro']) {
    cx.globalAlpha = alpha;
    cx.drawImage(IMG['intro'], 0, 0, VW, VH);
  }

  // ── Animated orange glow (right side) ──
  const glowPulse = 0.06 + Math.sin(pulse * 1.4) * 0.025;
  cx.globalAlpha = alpha * glowPulse * 4;
  const og = cx.createRadialGradient(VW*0.82, VH*0.62, 0, VW*0.82, VH*0.55, VW*0.5);
  og.addColorStop(0, '#c84010');
  og.addColorStop(0.5,'#6a1c00');
  og.addColorStop(1, 'transparent');
  cx.globalCompositeOperation = 'screen';
  cx.fillStyle = og;
  cx.fillRect(0, 0, VW, VH);

  // ── Animated teal glow (left side) ──
  cx.globalAlpha = alpha * (0.04 + Math.sin(pulse * 1.1 + 1) * 0.02) * 3;
  const tg = cx.createRadialGradient(VW*0.14, VH*0.40, 0, VW*0.14, VH*0.40, VW*0.45);
  tg.addColorStop(0, '#1a8090');
  tg.addColorStop(0.5,'#0a3a44');
  tg.addColorStop(1, 'transparent');
  cx.fillStyle = tg;
  cx.fillRect(0, 0, VW, VH);

  // ── Film grain overlay ──
  if (!grainCv) buildGrain();
  cx.globalAlpha = alpha * 0.18;
  cx.globalCompositeOperation = 'overlay';
  cx.drawImage(grainCv, 0, 0, VW, VH);

  // ── Horizontal scan-line shimmer ──
  cx.globalCompositeOperation = 'source-over';
  cx.globalAlpha = alpha * 0.03;
  cx.fillStyle = '#fff';
  const lineY = ((pulse * 60) % VH);
  cx.fillRect(0, lineY, VW, 2);

  // ── Vignette ──
  cx.globalAlpha = alpha * 0.55;
  cx.globalCompositeOperation = 'source-over';
  const vg = cx.createRadialGradient(VW/2,VH/2, VH*0.2, VW/2,VH/2, VH*0.85);
  vg.addColorStop(0, 'transparent');
  vg.addColorStop(1, '#000');
  cx.fillStyle = vg;
  cx.fillRect(0, 0, VW, VH);

  cx.restore();

  // ── Skip hint (fades in after 0.6s) ──
  if (introTimer > 0.6) {
    const skipAlpha = Math.min(1, (introTimer - 0.6) / 0.5) * alpha;
    cx.save();
    cx.globalAlpha = skipAlpha * (0.28 + Math.sin(pulse * 2.5) * 0.14);
    cx.font = '10px monospace';
    cx.fillStyle = '#aaa';
    cx.textAlign = 'right';
    cx.fillText('TAP TO SKIP', VW - 18, VH - 14);
    cx.restore();
  }
}

function drawDialogue() {
  if (dlgIdx >= DLG.length) return;
  const d = DLG[dlgIdx];

  const FONT_TITLE = "900 18px 'Bangers', Impact, sans-serif";
  const FONT_HINT  = "italic 11px 'Comic Neue', 'Comic Sans MS', Arial, sans-serif";

  const panelY = Math.round(VH * 0.46);
  const panelH = VH - panelY;
  const portW  = Math.round(VW * 0.29);

  // ── Scene — upper half visible, bottom darkens into panel ──
  drawBg(0);
  cx.save();
  const fadeG = cx.createLinearGradient(0, panelY - 60, 0, panelY + 10);
  fadeG.addColorStop(0, 'transparent');
  fadeG.addColorStop(1, 'rgba(0,0,0,0.92)');
  cx.fillStyle = fadeG;
  cx.fillRect(0, panelY - 60, VW, 70);
  cx.restore();

  // ── Panel base — deep black ─────────────────────────────────
  cx.fillStyle = '#050209';
  cx.fillRect(0, panelY, VW, panelH);

  // ── Screen-tone diagonal lines (classic manga/GN texture) ──
  cx.save();
  cx.strokeStyle = d.col === '#00ffcc' ? '#06141a' : '#180610';
  cx.lineWidth = 0.7;
  cx.globalAlpha = 0.6;
  for (let x = -panelH; x < VW + panelH; x += 7) {
    cx.beginPath();
    cx.moveTo(x, panelY);
    cx.lineTo(x + panelH, VH);
    cx.stroke();
  }
  cx.restore();

  // ── Heavy top ink border ────────────────────────────────────
  cx.fillStyle = '#000';
  cx.fillRect(0, panelY - 7, VW, 8);
  cx.fillStyle = d.col;
  cx.fillRect(0, panelY - 1, VW, 4);

  // ── PORTRAIT PANEL ─────────────────────────────────────────
  cx.save();
  cx.beginPath();
  cx.rect(0, panelY, portW, panelH);
  cx.clip();

  cx.fillStyle = '#000';
  cx.fillRect(0, panelY, portW, panelH);

  const portrait = IMG[d.portrait];
  if (portrait) {
    const imgAR = portrait.naturalWidth / portrait.naturalHeight;
    const panAR = portW / panelH;
    let sx=0, sy=0, sw=portrait.naturalWidth, sh=portrait.naturalHeight;
    if (imgAR > panAR) {
      sw = portrait.naturalHeight * panAR;
      sx = (portrait.naturalWidth - sw) * 0.38;
    } else {
      sh = portrait.naturalWidth / panAR;
      sy = (portrait.naturalHeight - sh) * 0.08;
    }
    cx.drawImage(portrait, sx, sy, sw, sh, 0, panelY, portW, panelH);
  }

  // Right-edge fade into panel
  const fadeR = cx.createLinearGradient(portW - 45, 0, portW, 0);
  fadeR.addColorStop(0, 'transparent');
  fadeR.addColorStop(1, '#050209');
  cx.fillStyle = fadeR;
  cx.fillRect(portW - 45, panelY, 45, panelH);
  cx.restore();

  // Portrait divider — thick ink
  cx.fillStyle = '#000';
  cx.fillRect(portW, panelY, 5, panelH);
  cx.fillStyle = d.col;
  cx.fillRect(portW + 5, panelY, 2.5, panelH);

  // ── SPEAKER NAME — Bangers font, bottom of portrait ────────
  cx.save();
  const nameBarH = 28;
  cx.fillStyle = d.col;
  cx.fillRect(0, VH - nameBarH, portW, nameBarH);
  // Diagonal slash accent
  cx.fillStyle = 'rgba(0,0,0,0.25)';
  cx.beginPath();
  cx.moveTo(portW - 40, VH - nameBarH);
  cx.lineTo(portW, VH - nameBarH);
  cx.lineTo(portW - 14, VH);
  cx.lineTo(portW - 54, VH);
  cx.closePath();
  cx.fill();
  cx.font = FONT_TITLE;
  cx.textAlign = 'center';
  cx.letterSpacing = '3px';
  cx.fillStyle = '#000';
  cx.fillText(d.who, portW / 2 + 1, VH - 9);
  cx.restore();

  // ── SPEECH BUBBLE — cream white, black ink, proper tail ────
  cx.save();
  const bx  = portW + 18;
  const by  = panelY + 12;
  const bw  = VW - bx - 14;
  const bh  = panelH - 44;
  const rad = 12;

  // Hard drop shadow
  cx.fillStyle = 'rgba(0,0,0,0.55)';
  cx.beginPath();
  cx.roundRect(bx + 5, by + 5, bw, bh, rad);
  cx.fill();

  // Cream bubble fill
  cx.fillStyle = '#fdfbf0';
  cx.beginPath();
  // Top edge
  cx.moveTo(bx + rad, by);
  cx.lineTo(bx + bw - rad, by);
  cx.arcTo(bx+bw, by,      bx+bw, by+rad,   rad);
  cx.lineTo(bx+bw, by+bh-rad);
  cx.arcTo(bx+bw, by+bh,   bx+bw-rad, by+bh, rad);
  cx.lineTo(bx+rad, by+bh);
  cx.arcTo(bx, by+bh,      bx, by+bh-rad,   rad);
  // Left side with tail
  cx.lineTo(bx, by + 52);
  cx.lineTo(bx - 16, by + 38);   // tail tip
  cx.lineTo(bx, by + 24);
  cx.lineTo(bx, by + rad);
  cx.arcTo(bx, by, bx+rad, by, rad);
  cx.closePath();
  cx.fill();

  // Ink outline — thick
  cx.strokeStyle = '#0a0a0a';
  cx.lineWidth = 3;
  cx.stroke();

  // Inner subtle texture lines (graphic novel depth)
  cx.strokeStyle = 'rgba(0,0,0,0.06)';
  cx.lineWidth = 1;
  for (let ty = by + 18; ty < by + bh - 8; ty += 8) {
    cx.beginPath();
    cx.moveTo(bx + 10, ty);
    cx.lineTo(bx + bw - 10, ty);
    cx.stroke();
  }

  // ── Dialogue text — auto-size to fill bubble ──
  cx.fillStyle = '#0a0a0a';
  cx.textAlign = 'left';
  cx.shadowColor = 'transparent';
  const pad = 20;
  const maxW = bw - pad * 2;
  const bubbleH = bh - 52;  // usable height inside bubble

  // Find largest font size where text wraps and fits vertically
  let fontSize = 28, lineH, lines;
  while (fontSize >= 13) {
    cx.font = `900 ${fontSize}px 'Bangers', Impact, sans-serif`;
    lineH = fontSize * 1.22;
    lines = [];
    let cur = '';
    for (const w of d.txt.split(' ')) {
      const test = cur + w + ' ';
      if (cx.measureText(test).width > maxW && cur) {
        lines.push(cur.trim()); cur = w + ' ';
      } else cur = test;
    }
    lines.push(cur.trim());
    if (lines.length * lineH <= bubbleH) break;
    fontSize -= 1;
  }

  // Vertically center the text block in the bubble
  const totalH = lines.length * lineH;
  let ly = by + 16 + (bubbleH - totalH) / 2 + lineH * 0.85;
  cx.font = `900 ${fontSize}px 'Bangers', Impact, sans-serif`;
  for (const ln of lines) {
    cx.fillText(ln, bx + pad, ly);
    ly += lineH;
  }
  cx.restore();

  // ── CONTINUE HINT — italic, bottom right ───────────────────
  cx.save();
  cx.globalAlpha = 0.45 + Math.sin(pulse * 3.5) * 0.42;
  cx.font = FONT_HINT;
  cx.fillStyle = d.col;
  cx.textAlign = 'right';
  cx.fillText('tap to continue ▶', VW - 14, VH - 8);
  cx.restore();

  // ── PROGRESS DOTS ──────────────────────────────────────────
  cx.save();
  const dotCX = portW / 2;
  for (let i = 0; i < DLG.length; i++) {
    const active = i === dlgIdx;
    cx.fillStyle   = active ? d.col : 'rgba(255,255,255,0.15)';
    cx.strokeStyle = d.col;
    cx.lineWidth   = 1.5;
    cx.beginPath();
    cx.arc(dotCX + (i - 1) * 18, VH - nameBarH - 12, active ? 5.5 : 3.5, 0, Math.PI*2);
    cx.fill(); cx.stroke();
  }
  cx.restore();
}


function drawWinDlg() {
  if (winDlgIdx >= WIN_DLG.length) return;
  const d = WIN_DLG[winDlgIdx];

  // Draw dialogue using win data — inline to avoid array mutation
  const savedIdx = dlgIdx;
  dlgIdx = winDlgIdx;
  // Temporarily patch DLG entries
  const origLen = DLG.length;
  WIN_DLG.forEach((l, i) => { DLG[i] = l; });
  DLG.length = WIN_DLG.length;

  drawBg(0.72);
  drawDialogue();

  // Restore DLG
  DLG.length = origLen;
  [
    { who:'NAOMI',  col:'#00ffcc', portrait:'dlg_naomi1',  txt:'Sierra, we need to move faster. If my dad finds out I still have that notebook, it\'s over for both of us.' },
    { who:'SIERRA', col:'#ff2d78', portrait:'dlg_sierra1', txt:'Chill, Naomi. We\'re moving. Just keep your eyes on the path and stop looking back. You\'re drawing attention.' },
    { who:'NAOMI',  col:'#00ffcc', portrait:'dlg_naomi2',  txt:'This city is like a museum of people acting. I\'m done playing my part.' },
  ].forEach((l, i) => { DLG[i] = l; });
  dlgIdx = savedIdx;
}

function drawEndCard() {
  // Black base
  cx.fillStyle = '#000';
  cx.fillRect(0, 0, VW, VH);

  // Intro image as base with heavy overlay
  if (IMG['intro']) {
    cx.save();
    const t = Math.min(endTimer / 1.2, 1);
    cx.globalAlpha = t;
    cx.drawImage(IMG['intro'], 0, 0, VW, VH);
    cx.globalAlpha = t * 0.55;
    cx.fillStyle = '#000';
    cx.fillRect(0, 0, VW, VH);
    cx.restore();
  }

  // Season 2 tag
  const t = Math.min(endTimer / 1.8, 1);
  cx.save();
  cx.globalAlpha = t;
  cx.font = "12px 'Bangers', Impact, sans-serif";
  cx.fillStyle = '#c86030';
  cx.letterSpacing = '4px';
  cx.textAlign = 'center';
  cx.fillText('SEASON TWO  /  COMING SOON', VW/2, VH * 0.28);

  // TWISTED title
  cx.globalAlpha = Math.min((endTimer - 0.3) / 1.2, 1) * 1;
  cx.shadowBlur = 40; cx.shadowColor = '#c86030';
  cx.font = `bold ${70 + Math.sin(pulse*1.5)*1.5}px serif`;
  cx.fillStyle = '#fff';
  cx.fillText('twisted', VW/2, VH * 0.52);

  // Tagline
  cx.shadowBlur = 0;
  cx.globalAlpha = Math.min((endTimer - 0.8) / 1.0, 1);
  cx.font = "italic 18px 'Comic Neue', 'Comic Sans MS', serif";
  cx.fillStyle = '#d4d4d4';
  cx.letterSpacing = '1px';
  cx.fillText('twisted minds together', VW/2, VH * 0.65);

  // Notebook hint line — the real hook
  cx.globalAlpha = Math.min((endTimer - 1.4) / 1.2, 1);
  cx.font = "13px 'Comic Neue', 'Comic Sans MS', monospace";
  cx.fillStyle = '#00ffcc';
  cx.fillText('"The notebook changes everything."', VW/2, VH * 0.76);

  // Tap to replay
  cx.globalAlpha = (Math.min((endTimer - 2.0) / 1.0, 1)) * (0.4 + Math.sin(pulse*3)*0.4);
  cx.font = "italic 11px 'Comic Neue', monospace";
  cx.fillStyle = '#888';
  cx.fillText('tap to play again', VW/2, VH * 0.91);

  cx.restore();
}

function drawOverlay(col, title, sub, hint) {
  cx.save();
  cx.fillStyle=col; cx.fillRect(0,0,VW,VH);
  cx.shadowBlur=35; cx.shadowColor=title.startsWith('C')?'#ff0000':'#00ff88';
  cx.font='bold 52px serif'; cx.fillStyle='#fff'; cx.textAlign='center';
  cx.fillText(title, VW/2, VH*0.38);
  cx.shadowBlur=0; cx.font='15px monospace'; cx.fillStyle='#ccc';
  cx.fillText(sub, VW/2, VH*0.54);
  cx.globalAlpha=0.5+Math.sin(pulse*3)*0.5;
  cx.font='14px monospace'; cx.fillStyle='#fff';
  cx.fillText(hint, VW/2, VH*0.72);
  cx.restore();
}

// ─── Main render loop ─────────────────────────────────────────────────────────
function render(ts) {
  try {
    update(ts);
    cx.clearRect(0, 0, cv.width, cv.height);
    cx.save();
    cx.translate(offX, offY);
    cx.scale(scale, scale);

  switch (phase) {
    case PH.INSTALL:
      drawInstall();
      break;

    case PH.INTRO:
      // Intro video plays above canvas — canvas stays black underneath
      cx.fillStyle = '#000';
      cx.fillRect(0, 0, VW, VH);
      break;

    case PH.TITLE:
      drawTitle();
      break;

    case PH.DLG:
      drawDialogue();
      break;

    case PH.CUTSCENE:
      // Video plays underneath — canvas is transparent, just draw skip hint
      cx.save();
      cx.globalAlpha = 0.3 + Math.sin(pulse * 2.5) * 0.18;
      cx.font = "italic 11px 'Comic Neue', monospace";
      cx.fillStyle = '#fff';
      cx.textAlign = 'right';
      cx.fillText('tap to skip ▶', VW - 16, VH - 14);
      cx.restore();
      break;

    case PH.CROSSFADE: {
      // Render full game scene — canvas fades in as video fades out beneath
      const cfAlpha = Math.min(1, crossfadeTimer / CROSSFADE_DUR);
      cx.save(); cx.globalAlpha = cfAlpha;
      drawBg();
      drawSpotlight();
      drawCar();
      drawEntities();
      drawWinGlow();
      cx.restore();
      cx.save(); cx.globalAlpha = cfAlpha;
      drawMinimap();
      drawHUD();
      cx.restore();
      break;
    }

    case PH.PLAY:
      drawBg();
      drawSpotlight();
      drawCar();
      drawEntities();    // bins + characters depth-sorted together
      drawWinGlow();
      // Spotted flash
      if (catchFlash > 0) {
        cx.save();
        cx.globalAlpha=catchFlash*0.55; cx.fillStyle='#ff0000'; cx.fillRect(0,0,VW,VH);
        cx.globalAlpha=catchFlash; cx.shadowBlur=20; cx.shadowColor='#ff0000';
        cx.font='bold 44px serif'; cx.fillStyle='#fff'; cx.textAlign='center';
        cx.fillText('SPOTTED!', VW/2, VH/2);
        cx.restore();
      }
      drawMinimap();
      drawHUD();
      drawInteractPrompt();
      drawInventoryBag();
      drawPhoneMenu();
      drawJoystick();
      break;

    case PH.CAUGHT:
      drawBg(0.82);
      drawOverlay('rgba(160,0,0,0.88)', 'CAUGHT', 'You were spotted too many times.', 'TAP TO TRY AGAIN');
      break;

    case PH.WIN:
      // Brief flash before win dialogue
      drawBg(0.3);
      cx.save();
      cx.globalAlpha = Math.max(0, 1 - winFlashTimer * 1.5);
      cx.fillStyle = '#00ff8844';
      cx.fillRect(0, 0, VW, VH);
      cx.shadowBlur = 30; cx.shadowColor = '#00ff88';
      cx.font = "bold 38px 'Bangers', Impact, serif";
      cx.fillStyle = '#00ff88'; cx.textAlign = 'center';
      cx.fillText('NOTEBOOK SECURED', VW/2, VH/2);
      cx.restore();
      break;

    case PH.WIN_DLG:
      drawWinDlg();
      break;

    case PH.END:
      drawEndCard();
      break;
  }

  cx.restore();
  } catch(e) {
    console.error('RENDER ERROR:', e);
    cx.restore();
  }
  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>

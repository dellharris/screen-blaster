  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      /* Prevent iOS bounce scroll that can shift canvas */
      position: fixed;
      top: 0; left: 0;
    }
    canvas {
      position: fixed; top: 0; left: 0;
      display: block; z-index: 2;

      text-align: center;

    }
    #rotate-msg span { font-size: 48px; }
    @media (orientation: portrait) and (max-width: 900px) {

    }

<script>
'use strict';

// ─── Canvas setup ─────────────────────────────────────────────────────────────
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
const VW = 900, VH = 500;
let scale = 1, offX = 0, offY = 0;

// Demo/capture mode — activated via ?demo=1 in URL
const DEMO_MODE = new URLSearchParams(window.location.search).get('demo') === '1';
// Center character zone for portrait crop (game x ≈ 600 = mid-alley)
const DEMO_FOCUS_X = 595;

function resize() {
  const vv = window.visualViewport;
  const w = vv ? vv.width  : window.innerWidth;
  const h = vv ? vv.height : window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width  = w + 'px';
  cv.style.height = h + 'px';
  if (vv) { cv.style.left = vv.offsetLeft + 'px'; cv.style.top = vv.offsetTop + 'px'; }
  if (DEMO_MODE) {
    // Fill portrait height, center crop on character zone
    scale = cv.height / VH;
    offX  = cv.width / 2 - DEMO_FOCUS_X * scale;
    offY  = 0;
  } else {
    scale = Math.min(cv.width / VW, cv.height / VH);
    offX  = (cv.width  - VW * scale) / 2;
    offY  = (cv.height - VH * scale) / 2;
  }
}

// Fire resize immediately, then again after iOS finishes animating the rotation
function onOrientationChange() {
  resize();
  setTimeout(resize, 100);
  setTimeout(resize, 300);
  setTimeout(resize, 600);
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', onOrientationChange);
// visualViewport fires its own resize event — most reliable on iOS
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize',  resize);
  window.visualViewport.addEventListener('scroll',  resize);
}
resize();

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ─── Assets ───────────────────────────────────────────────────────────────────
const IMG = {};
const SPR = {};
const CHAR_KEYS = [
  'sierra_front','sierra_back','sierra_side','sierra_backq',
  'sierra_front_a','sierra_front_b','sierra_back_a','sierra_back_b',
  'sierra_side_a','sierra_side_b','sierra_backq_a','sierra_backq_b',
  'sierra_squat',
  'naomi_front', 'naomi_back', 'naomi_side', 'naomi_backq',
  'naomi_front_a','naomi_front_b','naomi_back_a','naomi_back_b',
  'naomi_side_a','naomi_side_b','naomi_backq_a','naomi_backq_b',
  'naomi_squat',
  'naomi_shock_1','naomi_shock_2','naomi_shock_3','naomi_shock_4',
  'naomi_shock_5','naomi_shock_6','naomi_shock_7','naomi_shock_8',
  // rats removed — already RGBA transparent, processSprite would strip ink outlines
  'cloud_flat','cloud_tall','cloud_wisp',
  'cloud_flat_1','cloud_flat_2','cloud_flat_3','cloud_flat_4','cloud_flat_5','cloud_flat_6',
  'cloud_tall_1','cloud_tall_2','cloud_tall_3','cloud_tall_4','cloud_tall_5','cloud_tall_6',
  'cloud_wisp_1','cloud_wisp_2','cloud_wisp_3','cloud_wisp_4','cloud_wisp_5','cloud_wisp_6',
  'bird_fly_1','bird_fly_2','bird_fly_3','bird_fly_4','bird_fly_5','bird_fly_6',
  'bird_fly_7','bird_fly_8','bird_fly_9','bird_fly_10','bird_fly_11','bird_fly_12',
  'bird_front_1','bird_front_2','bird_front_3','bird_front_4','bird_front_5','bird_front_6',
  'bird_front_7','bird_front_8','bird_front_9','bird_front_10','bird_front_11','bird_front_12',
  'bird_land_1','bird_land_2','bird_land_3','bird_land_4',
  'bird_perch_1','bird_perch_2','bird_stand','bird_alert','bird_takeoff',
  'police',
];

function processSprite(key) {
  const img = IMG[key];
  if (!img || !img.complete || img.naturalWidth === 0) {
    SPR[key] = img || null;
    return;
  }
  // Resize to working resolution
  const maxH = 512;
  const ratio = img.naturalWidth / img.naturalHeight;
  const h = maxH, w = Math.max(1, Math.round(h * ratio));
  const oc = document.createElement('canvas');
  oc.width = w; oc.height = h;
  const gc = oc.getContext('2d');
  gc.drawImage(img, 0, 0, w, h);
  try {
    const id = gc.getImageData(0, 0, w, h);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const bright = Math.max(d[i], d[i+1], d[i+2]);
      if (bright < 8)       d[i+3] = 0;
      else if (bright < 20) d[i+3] = Math.floor((bright - 8) / 12 * 255);
    }
    gc.putImageData(id, 0, 0);
    SPR[key] = oc;
  } catch(e) {
    // getImageData blocked — use raw image, screen blend will handle bg
    SPR[key] = img;
  }
}

function loadImg(k, src) {
  const i = new Image();
  i.onload  = () => { IMG[k] = i; if (CHAR_KEYS.includes(k)) processSprite(k); };
  i.onerror = () => { IMG[k] = null; SPR[k] = null; };
  i.src = src;
}

loadImg('intro',        'assets/intro.jpg');
loadImg('scene',        'assets/scene.png?v=4');
loadImg('fg',           'assets/foreground.png');
loadImg('fg_box',       'assets/fg_box.png');     // foreground crates — bottom-right parallax
loadImg('police',       'assets/police.png');
// Dialogue comic portraits (used as-is, no black removal needed)
loadImg('dumpster',     'assets/dumpster.png');
loadImg('bag_icon',     'assets/bag_icon.png');
loadImg('phone_icon',   'assets/phone_icon.png');
// Dumpster mission frames
['dumpster_closed','dumpster_cracking','dumpster_ajar',
 'dumpster_open_key_far','dumpster_open_key_a','dumpster_open_key_b',
 'dumpster_open_key_c','dumpster_open_key_d','dumpster_open_empty']
  .forEach(k => loadImg(k, `assets/${k}.png`));
// Inventory item icons — used in the bag drawer
loadImg('trash_key', 'assets/trash_key.png');
loadImg('trash_gun', 'assets/trash_gun.png');

// ─── Perspective floor definition ─────────────────────────────────────────────
// Calibrated against the Miami alley backdrop:
// Vanishing point ~center at y≈52%, left wall converges harder than right.
const FL = {
  topY: VH * 0.44,  botY: VH * 0.98,   // floor y range (far → near) — calibrated for new scene
  topXL: VW * 0.33, topXR: VW * 0.67,  // alley mouth at far end (narrow)
  botXL: VW * 0.00, botXR: VW * 1.00,  // full width at near camera
};

// World → screen. wx=0..1 (left→right on floor), wz=0..1 (far→near = small→big)
function w2s(wx, wz) {
  const lx = lerp(FL.topXL, FL.botXL, wz);
  const rx = lerp(FL.topXR, FL.botXR, wz);
  const sy = lerp(FL.topY,  FL.botY,  wz);
  return { x: lx + wx * (rx - lx), y: sy };
}

// Depth scale: far=0.22 (tiny at vanishing point), near=1.20 (fills frame)
function dScale(wz) { return lerp(0.22, 1.20, wz); }

// ─── Web Audio sound effects ──────────────────────────────────────────────────
let AC = null;

function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

// Generic synth shot: type, freq, duration, volume
function sfx(type, freq, dur, vol, filterFreq) {
  try {
    const ac = getAC();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    const now = ac.currentTime;
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.4, now + dur);
    gain.gain.setValueAtTime(vol || 0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    if (filterFreq) {
      const flt = ac.createBiquadFilter();
      flt.type = 'lowpass'; flt.frequency.value = filterFreq;
      osc.connect(flt); flt.connect(gain);
    } else {
      osc.connect(gain);
    }
    gain.connect(ac.destination);
    osc.start(now); osc.stop(now + dur);
  } catch(e) {}
}

// Noise burst (footstep / rustle)
function sfxNoise(dur, vol, filterFreq) {
  try {
    const ac = getAC();
    const bufSize = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
    const src = ac.createBufferSource();
    src.buffer = buf;
    const gain = ac.createGain();
    const now = ac.currentTime;
    gain.gain.setValueAtTime(vol || 0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    const flt = ac.createBiquadFilter();
    flt.type = 'bandpass'; flt.frequency.value = filterFreq || 300; flt.Q.value = 0.8;
    src.connect(flt); flt.connect(gain); gain.connect(ac.destination);
    src.start(now); src.stop(now + dur);
  } catch(e) {}
}

// Footstep ticker
let stepTimer = 0;
function tickFootsteps(dt, moving, running, crouching) {
  if (!moving) { stepTimer = 0; return; }
  const rate = crouching ? 0.55 : running ? 0.18 : 0.30;
  stepTimer += dt;
  if (stepTimer >= rate) {
    stepTimer = 0;
    if (crouching) SFX.stepCrouch();
    else if (running) SFX.stepRun();
    else SFX.stepWalk();
  }
}

function triggerCrouch() {
  const wasStanding = !P.crouch;
  P.crouch = !P.crouch;
  // Pick left or right facing sequence based on current direction
  const facingLeft = P.lastMvx < -0.1;
  if (wasStanding) {
    P.transSeq = facingLeft ? NAOMI_CROUCH_IN_LEFT : NAOMI_CROUCH_IN;
  } else {
    P.transSeq = facingLeft ? NAOMI_CROUCH_OUT_LEFT : NAOMI_CROUCH_OUT;
  }
  P.transFrame = 0; P.transTimer = 0;
  if (wasStanding) {
    playLatch('squat', function() { P.crouch = true; P.crouchLerp = 1; });
  }
}

let grainCv = null;
function buildGrain() {
  grainCv = document.createElement('canvas');
  grainCv.width = VW; grainCv.height = VH;
  const gc = grainCv.getContext('2d');
  const id = gc.createImageData(VW, VH);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = (Math.random() * 255) | 0;
    id.data[i] = id.data[i+1] = id.data[i+2] = v;
    id.data[i+3] = (Math.random() * 28) | 0;
  }
  gc.putImageData(id, 0, 0);

  { id:'binA', wxMin:0.50, wxMax:0.74, wzMin:0.39, wzMax:0.59 },
  { id:'binB', wxMin:0.72, wxMax:1.00, wzMin:0.26, wzMax:0.48 }, // wall-sealed right edge

// Slide character around obstacles — called after every movement update
function resolveObstacles(newWx, newWz, prevWx, prevWz) {
  for (const o of OBSTACLES) {
    if (newWx >= o.wxMin && newWx <= o.wxMax &&
        newWz >= o.wzMin && newWz <= o.wzMax) {
      const prevInX = prevWx >= o.wxMin && prevWx <= o.wxMax;
      if (!prevInX) {
        // Entered from the side — slide along X edge, keep Z
        newWx = prevWx < (o.wxMin + o.wxMax) * 0.5 ? o.wxMin - 0.005 : o.wxMax + 0.005;
      } else {
        // Entered from front/back — slide along Z edge, keep X
        newWz = prevWz < (o.wzMin + o.wzMax) * 0.5 ? o.wzMin - 0.005 : o.wzMax + 0.005;
      }
    }
  }
  return { wx: newWx, wz: newWz };
}

var TRASH_GAME_EL  = null;  // initialized after DOM ready
var trashTimer     = 0;
var trashActive    = false;
var trashItems     = [];    // [{type, revealed, el}]
var trashFoundKey  = false;
var trashFoundGun  = false;
var trashInterval  = null;
const TRASH_TIME   = 10;

// Junk items (emoji + label)
const JUNK_IMGS = ['trash_junk_1','trash_junk_2','trash_junk_3','trash_junk_4','trash_junk_5'];
// Pick random 2 variants of mystery pile for unrevealed look
const MYSTERY_IMGS = ['trash_mystery_1','trash_mystery_2','trash_mystery_3'];

function openTrashGame() {
  TRASH_GAME_EL = document.getElementById('trash-game');
  trashFoundKey = false; trashFoundGun = false; trashActive = true;
  trashTimer = TRASH_TIME;

  // Build 8 items: 6 junk + 1 key + 1 gun, shuffled
  const shuffledJunk = [...JUNK_IMGS].sort(function(){ return Math.random()-0.5; }).slice(0,6)
    .map(function(img){ return {img:img, type:'junk'}; });
  const pool = [...shuffledJunk,
    {img:'trash_key', type:'key'},
    {img:'trash_gun', type:'gun'},
  ].sort(function(){ return Math.random()-0.5; });

  trashItems = pool;

  // Build grid with image tiles
  const grid = document.getElementById('trash-grid');
  grid.innerHTML = '';
  pool.forEach(function(item, i) {
    const div = document.createElement('div');
    div.className = 'trash-pile';
    // Show random mystery pile as unrevealed state
    const mystImg = MYSTERY_IMGS[i % MYSTERY_IMGS.length];
    div.innerHTML = '<img src="assets/' + mystImg + '.png" alt="?">';
    div.addEventListener('click', function(){ revealTrashItem(i); });
    div.addEventListener('touchstart', function(e){ e.preventDefault(); revealTrashItem(i); }, {passive:false});
    item.el = div;
    item.revealed = false;
    grid.appendChild(div);
  });

  // Reset UI
  document.getElementById('trash-result').style.display = 'none';
  document.getElementById('trash-status').textContent = 'Tap piles to search — find the key!';
  document.getElementById('trash-subtitle').textContent = 'Find the key — find the gun for a bonus';
  document.getElementById('trash-timer-display').textContent = TRASH_TIME;
  document.getElementById('trash-timer-bar').style.width = '100%';
  TRASH_GAME_EL.style.display = 'flex';

  // Start countdown
  if (trashInterval) clearInterval(trashInterval);
  trashInterval = setInterval(trashTick, 100);
}

function trashTick() {
  if (!trashActive) return;
  trashTimer = Math.max(0, trashTimer - 0.1);
  const pct = (trashTimer / TRASH_TIME) * 100;
  document.getElementById('trash-timer-display').textContent = Math.ceil(trashTimer);
  var bar = document.getElementById('trash-timer-bar');
  bar.style.clipPath = 'inset(0 ' + (100-pct) + '% 0 0)';
  bar.src = pct < 30 ? 'assets/trash_timer_low.png' : 'assets/trash_timer_full.png';
  if (trashTimer <= 0) trashFail();
}

function revealTrashItem(i) {
  const item = trashItems[i];
  if (!trashActive || item.revealed) return;
  item.revealed = true;
  const el = item.el;
  el.innerHTML = '<img src="assets/' + item.img + '.png" alt="">';
  SFX.btnTap();

  if (item.type === 'key') {
    el.classList.add('revealed','key-found');
    trashFoundKey = true;
    sfx('sine', 880, 0.1, 0.2); setTimeout(function(){ sfx('sine',1100,0.12,0.25); },100);
    document.getElementById('trash-status').textContent = '🗝️ Found the key! ' + (trashFoundGun?'PERFECT!':'Keep searching for the gun...');
    if (trashFoundGun) { setTimeout(trashPerfect, 600); return; }
    // Pass after short delay if they already found key but not gun
    setTimeout(function(){ if (trashActive && trashFoundKey && !trashFoundGun) trashPass(); }, 2000);
  } else if (item.type === 'gun') {
    el.classList.add('revealed','gun-found');
    trashFoundGun = true;
    sfx('sine', 660, 0.1, 0.2); setTimeout(function(){ sfx('sine',880,0.12,0.25); },80);
    document.getElementById('trash-status').textContent = '🔫 Found the gun! ' + (trashFoundKey?'PERFECT!':'Now find the key!');
    if (trashFoundKey) { setTimeout(trashPerfect, 600); }
  } else {
    el.classList.add('revealed','junk-found');
    el.classList.add('shake');
    setTimeout(function(){ el.classList.remove('shake'); }, 300);
  }
}

function trashPerfect() {
  if (!trashActive) return;
  trashActive = false; clearInterval(trashInterval);
  addItem('key', 'Door Key', '🗝️');
  addItem('gun', 'Gun', '🔫');
  SFX.keyPickup();
  MISSION_DUMP.state = 'open_empty';
  showTrashResult('PERFECT!', 'KEY + GUN secured', 'Let\'s go →', closeTrashGame, 'trash_banner_perfect');
}

function trashPass() {
  if (!trashActive) return;
  trashActive = false; clearInterval(trashInterval);
  addItem('key', 'Door Key', '🗝️');
  SFX.keyPickup();
  MISSION_DUMP.state = 'open_empty';
  showTrashResult('GOT IT', 'Key found', 'Move out →', closeTrashGame, 'trash_banner_pass');

function trashFail() {
  trashActive = false; clearInterval(trashInterval);
  sfx('sawtooth', 200, 0.4, 0.2);

    document.getElementById('trash-result').style.display = 'none';

function showTrashResult(title, sub, btnText, btnAction, bannerImg) {
  var ri = document.getElementById('trash-result-img');
  ri.src = bannerImg ? 'assets/' + bannerImg + '.png' : '';
  ri.style.display = bannerImg ? 'block' : 'none';
  const btn = document.getElementById('trash-result-btn');
  btn.textContent = btnText;
  btn.onclick = btnAction;
  const resultEl = document.getElementById('trash-result');
  resultEl.style.display = 'block';
  // Auto-scroll result into view on mobile
  setTimeout(function(){ resultEl.scrollIntoView({behavior:'smooth',block:'end'}); }, 100);

  var el = document.getElementById('trash-game');
  el._tapClose = btnAction;

    // Only trigger if not tapping a pile
    if (e.target.closest('.trash-pile')) return;

  };

function closeTrashGame() {
  if (trashInterval) clearInterval(trashInterval);

function tryInteract(forcedByTap) {
  if (phase !== PH.PLAY) return;
  // Tap on dumpster/ring = no proximity check — you see it you can use it
  if (!forcedByTap) {
    const dist = Math.hypot(P.wx - MISSION_DUMP.wx, P.wz - MISSION_DUMP.wz);
    if (dist > MISSION_DUMP.interactRange) return;

  if (MISSION_DUMP.state === 'closed') {
    MISSION_DUMP.state = 'opening';
    MISSION_DUMP.frame = 0;
    MISSION_DUMP.timer = 0;
    SFX.dumpsterOpen();
  } else if (MISSION_DUMP.state === 'open_key') {
    // Launch trash search mini-game instead of direct pickup
    openTrashGame();
  }
}

var _cloudNextSpawn = 15 + Math.random() * 25;

function _spawnCloud() {
  var slot = CLOUDS.find(function(c){ return !c.active; });
  if (!slot) return;
  // Only puffy cloud types — no wispy stringy ones
  var types = ['flat','tall'];
  var t = types[Math.floor(Math.random() * types.length)];
  slot.active = true;
  slot.seq    = t;
  slot.f      = Math.floor(Math.random() * 6);
  slot.ft     = 0;
  slot.w      = 120 + Math.random() * 70;       // small — far distant
  slot.y      = 4   + Math.random() * 28;        // y=4–32: strictly above building tops
  slot.spd    = 1.2 + Math.random() * 1.8;       // 1.2–3 px/s: barely perceptible
  slot.a      = 0.18 + Math.random() * 0.16;     // 18–34% — very faded, deep background
  slot.flip   = Math.random() < 0.5;
  slot.x      = -slot.w / 2 - 10;
}

function tickClouds(dt) {
  _cloudNextSpawn -= dt;
  if (_cloudNextSpawn <= 0) {
    _spawnCloud();
    _cloudNextSpawn = 28 + Math.random() * 35;  // next cloud 28-63s later
  }
  CLOUDS.forEach(function(c) {
    if (!c.active) return;
    c.x += c.spd * dt;
    if (c.x - c.w/2 > VW + 20) c.active = false;  // exit, don't wrap
    var seq = CLOUD_SEQS[c.seq];
    c.ft += dt;
    if (c.ft >= seq[c.f].dur) { c.ft = 0; c.f = (c.f+1) % seq.length; }
  });
}

function drawClouds() {
  cx.save();
  CLOUDS.forEach(function(c) {
    if (!c.active) return;
    var seq = CLOUD_SEQS[c.seq];
    var key = seq[c.f].key;
    var spr = SPR[key] || IMG[key]; if (!spr) return;
    var cw2 = c.w, ch2 = cw2 * (spr.height / spr.width);
    cx.globalAlpha = c.a;
    cx.save();
    cx.translate(c.x, c.y + ch2/2);
    if (c.flip) cx.scale(-1, 1);
    cx.drawImage(spr, -cw2/2, -ch2/2, cw2, ch2);
    cx.restore();
  });
  cx.globalAlpha = 1;
  cx.restore();
}

// Pack state — 2 concurrent packs max
var RAT_PACKS = [{foodX:-1},{foodX:-1}];

// Pool of 6 rat instances
var RAT_POOL = (function(){
  var p=[];
  for(var i=0;i<6;i++) p.push({
    active:false, state:'dormant', packId:0, isLeader:false,
    x:0, y:0, vx:0, baseVx:0, h:26,
    frame:0, frameTimer:0, seq:null, flipH:false,
    eatTimer:0, eatDur:6,
    spawnDelay:0, spawnTimer:0, fleeing:false,
  });
  return p;
})();
var _ratNextPack = 6 + Math.random() * 16;  // first pack 6-22s in

function _ratFreeSlot() { return RAT_POOL.find(function(r){ return !r.active; })||null; }

function _ratSpawnOne(packId, fromLeft, y, speed, h, delay, isLeader) {
  var r = _ratFreeSlot(); if (!r) return;
  r.active=true; r.packId=packId; r.isLeader=isLeader;
  r.flipH=!fromLeft;
  r.x = fromLeft ? -55 : VW+55;
  r.y=y; r.h=h;
  r.baseVx = fromLeft ? speed : -speed; r.vx = r.baseVx;
  r.state='pending'; r.spawnDelay=delay; r.spawnTimer=0; r.fleeing=false;
  r.frame=0; r.frameTimer=0; r.seq=RAT_RUN_SEQ;
  r.eatTimer=0; r.eatDur = 4 + Math.random()*5;
}

function _ratSpawnPack() {
  // Find pack slot not in use
  var pid=0;
  for(var pi=0;pi<RAT_PACKS.length;pi++){
    if(!RAT_POOL.some(function(r){ return r.active && r.packId===pi; })){pid=pi;break;}
  }
  RAT_PACKS[pid].foodX=-1;
  var fromLeft = Math.random()<0.55;
  var count    = Math.random()<0.38 ? 3 : 2;  // 38% three rats, 62% two
  // Pick depth tier: near (larger/slower), mid, far (smaller/faster)
  var tier = Math.random();
  var baseY  = tier<0.40 ? 462+Math.random()*10 : tier<0.74 ? 422+Math.random()*10 : 384+Math.random()*10;
  var baseH  = tier<0.40 ? 28 : tier<0.74 ? 21 : 15;
  var baseSpd= tier<0.40 ? 195+Math.random()*55 : tier<0.74 ? 175+Math.random()*45 : 155+Math.random()*35;
  for(var i=0;i<count;i++){
    var delay  = i===0 ? 0 : 0.12 + Math.random()*0.68*i;  // irregular stagger
    var yOff   = (Math.random()-0.5)*18;
    var spdMul = 0.88+Math.random()*0.24;
    _ratSpawnOne(pid, fromLeft, baseY+yOff, baseSpd*spdMul, baseH+Math.round((Math.random()-0.5)*4), delay, i===0);
  }
}

function tickRats(dt) {
  if (phase !== PH.PLAY) return;
  _ratNextPack -= dt;
  if (_ratNextPack <= 0) {
    _ratSpawnPack();
    // Next pack: 25-70s, with irregular jitter so it never feels rhythmic
    _ratNextPack = 25 + Math.random()*45 + (Math.random()<0.3 ? 15 : 0);
  }
  RAT_POOL.forEach(function(r) {
    if (!r.active) return;
    // Wait for stagger delay
    if (r.state==='pending') {
      r.spawnTimer+=dt;
      if (r.spawnTimer>=r.spawnDelay) r.state='running';
      else return;
    }
    // Advance animation frame
    r.frameTimer+=dt;
    var seq=r.seq||RAT_RUN_SEQ;
    if (r.frameTimer>=seq[r.frame].dur) {
      r.frameTimer=0; r.frame++;
      if (r.frame>=seq.length) {
        if      (seq===RAT_SITUP_SEQ)   { r.seq=RAT_EAT_SEQ;  r.state='eating'; r.frame=0; }
        else if (seq===RAT_SITDOWN_SEQ) { r.seq=RAT_RUN_SEQ;  r.state='running'; r.frame=0; r.vx=r.baseVx; }
        else r.frame=0;  // run + eat loop
      }
    }
    if (r.state==='running') {
      r.x+=r.vx*dt;

      // Flee if either character gets within 90px screen-space
      if (!r.fleeing) {
        var pScr=w2s(P.renderWx, P.renderWz);
        var nScr=w2s(NPC.renderWx, NPC.renderWz);
        var dP=Math.hypot(r.x-pScr.x, r.y-pScr.y);
        var dN=Math.hypot(r.x-nScr.x, r.y-nScr.y);
        if (dP<90||dN<90) {
          r.fleeing=true;
          RAT_PACKS[r.packId].foodX=-1;  // cancel pack eat
          r.vx=(r.vx>=0?1:-1)*Math.abs(r.baseVx)*3.2;  // bolt in current direction
        }
      }

      // Leader decides whether pack eats (skip if fleeing)
      if (!r.fleeing && r.isLeader && RAT_PACKS[r.packId].foodX<0) {
        var inZone = r.x>185 && r.x<665;
        // Probabilistic check — not at a fixed point, feels organic
        if (inZone && Math.random()<dt*0.5) {
          RAT_PACKS[r.packId].foodX=r.x;
          r.state='slowing';
        }
      }
      // Follower: join eat if pack food spot set and close enough
      if (!r.fleeing && !r.isLeader && RAT_PACKS[r.packId].foodX>0) {
        if (Math.abs(r.x - RAT_PACKS[r.packId].foodX)<100) r.state='slowing';
      }
      if (r.x<-80||r.x>VW+80) { r.active=false; RAT_PACKS[r.packId].foodX=-1; }
    }
    if (r.state==='slowing') {
      r.vx*=Math.pow(0.025,dt);  // rapid deceleration
      r.x+=r.vx*dt;
      if (Math.abs(r.vx)<6) {
        // Snap near pack food spot (within ±28px so they look like sharing a source)
        if(RAT_PACKS[r.packId].foodX>0) r.x=RAT_PACKS[r.packId].foodX+(Math.random()-0.5)*28;
        r.vx=0; r.state='situp'; r.seq=RAT_SITUP_SEQ; r.frame=0; r.frameTimer=0;
      }
    }
    if (r.state==='eating') {
      r.eatTimer+=dt;
      if (r.eatTimer>=r.eatDur) {
        r.eatTimer=0; r.state='sitdown'; r.seq=RAT_SITDOWN_SEQ; r.frame=0; r.frameTimer=0;
        // Release food spot once first rat finishes
        if(r.isLeader) RAT_PACKS[r.packId].foodX=-1;
      }
    }
  });
}

function drawRats() {
  if (phase !== PH.PLAY) return;
  RAT_POOL.forEach(function(r) {
    if (!r.active || r.state==='pending' || r.state==='dormant') return;
    var seq=r.seq||RAT_RUN_SEQ;
    var fi=Math.min(r.frame, seq.length-1);
    var key=seq[fi].key;
    var spr=SPR[key]||IMG[key]; if (!spr) return;
    var rh=r.h, rw=rh*(spr.width/spr.height);
    cx.save();
    cx.translate(r.x, r.y);
    if (r.flipH) cx.scale(-1,1);
    cx.drawImage(spr, -rw/2, -rh, rw, rh);
    cx.restore();
  });
}

  { key:'naomi_step_left4', dur:0.09 },

  { key:'naomi_crouch_t1', dur:0.22 },
  { key:'naomi_crouch_t3', dur:0.22 },
  { key:'naomi_crouch_t4', dur:0.22 },

// Squat WALK cycle — 4 frames cycling while crouching+moving
// neutral → leg-forward → neutral → other-leg = natural squat waddle
// Squat walk facing RIGHT (default / forward)
const NAOMI_SQUAT_WALK = [
  'naomi_crouch_t4',
  'naomi_crouch_t2',
  'naomi_crouch_t1',
  'naomi_crouch_t3',
];

// Squat walk facing LEFT — mirrored frames
const NAOMI_SQUAT_WALK_LEFT = [
  'naomi_crouch_t4_left',
  'naomi_crouch_t2_left',
  'naomi_crouch_t1_left',
  'naomi_crouch_t3_left',

// Win zone: far-left door
const WIN = { wxMin: 0.00, wxMax: 0.14, wzMin: 0.00, wzMax: 0.32 };

// ─── State flags ──────────────────────────────────────────────────────────────
let isCaught = false, catchFlash = 0;

// ─── Input ────────────────────────────────────────────────────────────────────
const JOY = { on:false, id:null, sx:0, sy:0, dx:0, dy:0, r:58 };
let crouchId = null, runId = null, mouseDrag = false;
const KEYS = {};

function toV(touch) {
  const r = cv.getBoundingClientRect();
  return {
    x: ((touch.clientX - r.left) * (cv.width  / r.width)  - offX) / scale,
    y: ((touch.clientY - r.top)  * (cv.height / r.height) - offY) / scale,
  };
}

const CROUCH_BTN = { cx: VW-58,  cy: VH-88,  r: 46 };  // STAY LOW
const RUN_BTN    = { cx: VW-135, cy: VH-148, r: 30 };  // RUN
function isCrouchBtn(x, y) { return Math.hypot(x-CROUCH_BTN.cx, y-CROUCH_BTN.cy) < CROUCH_BTN.r; }
function isRunBtn(x, y)    { return Math.hypot(x-RUN_BTN.cx,    y-RUN_BTN.cy)    < RUN_BTN.r;    }

// Check if tap hits the mission dumpster on screen — generous hit area for mobile
function isDumpsterTap(x, y) {
  if (MISSION_DUMP.state === 'open_empty' || MISSION_DUMP.state === 'opening') return false;
  const ds = w2s(MISSION_DUMP.wx, MISSION_DUMP.wz);
  const sc = dScale(MISSION_DUMP.wz);
  // Big hit area covering both the dumpster body AND the ground ring below it
  const hitW = 160 * sc;
  const hitH = 200 * sc;  // tall enough to catch the ring at ds.y
  // Check rectangle: centered on dumpster, extending from ring to top of dumpster
  return x > ds.x - hitW/2 && x < ds.x + hitW/2 &&
         y > ds.y - hitH   && y < ds.y + 40 * sc;  // +40 below ground for ring
}
function isMuteBtn(x, y)   { return x > VW-110 && x < VW-16 && y > 8 && y < 44; }
function isJoyZone(x, y)   { return x < VW*0.45 && y > VH*0.42; }

function handleTap() {
  if (phase === PH.INSTALL)   { return; }
  if (phase === PH.INTRO)     { if (videosReady || loadingElapsed > 1.5) { phase = PH.TITLE; startMusic(); } return; }
  if (phase === PH.TITLE)     { phase = PH.DLG; return; }
  if (phase === PH.DLG)       { dlgIdx++; if (dlgIdx >= DLG.length) playCutscene(); return; }
  if (phase === PH.CUTSCENE)  { chainLatch(); return; }
  if (phase === PH.CROSSFADE) { crossfadeTimer = CROSSFADE_DUR; return; }
  if (phase === PH.WIN)       { endWinSequence(); return; }  // tap skips win video
  if (phase === PH.WIN_DLG)   { winDlgIdx++; if (winDlgIdx >= WIN_DLG.length) { phase = PH.END; endTimer = 0; } return; }
  if (phase === PH.END)       { resetGame(); return; }
  if (phase === PH.CAUGHT)    { if (P.catches < P.maxCatches) endCaughtVideo(); return; }  // tap skips only if lives remain
}

cv.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const p = toV(t);
    if (phase === PH.PLAY) {
      if (isCrouchBtn(p.x, p.y) && crouchId === null) { crouchId = t.identifier; triggerCrouch(); }
      else if (isRunBtn(p.x, p.y) && runId === null)  { runId = t.identifier; P.running = true; }
      else if (isMuteBtn(p.x, p.y)) { toggleMute(); }
      else if (isTargetBtn(p.x, p.y)) { triggerGunEmote(); }
      else if (isEmoteWheelBtn(p.x, p.y)) {
        EMOTE_WHEEL.active = true; EMOTE_WHEEL.touchId = t.identifier;
        EMOTE_WHEEL.selectedSlot = -1;
      } else if (EMOTE_WHEEL.active && t.identifier === EMOTE_WHEEL.touchId) {
        var s = getSlotAtPoint(p.x, p.y);
        EMOTE_WHEEL.selectedSlot = s;
      }
      else if (isPhoneBtn(p.x, p.y)) { openSoundCloud(); }
      else if (handlePhoneMenuTap(p.x, p.y)) { /* handled */ }
      else if (p.x > VW-116 && p.x < VW-16 && p.y > 56 && p.y < 96) { INVENTORY.open = !INVENTORY.open; if (INVENTORY.open) PHONE_OPEN = false; GUN_ITEM_BTN.visible=false; }
      else if (GUN_ITEM_BTN.visible && p.x > GUN_ITEM_BTN.x && p.x < GUN_ITEM_BTN.x+GUN_ITEM_BTN.w && p.y > GUN_ITEM_BTN.y && p.y < GUN_ITEM_BTN.y+GUN_ITEM_BTN.h) { triggerGunEmote(); }
      else if (isDumpsterTap(p.x, p.y)) { SFX.btnTap(); tryInteract(true); }
      else if (INTERACT_BTN_POS.visible && p.x > INTERACT_BTN_POS.x && p.x < INTERACT_BTN_POS.x + INTERACT_BTN_POS.w && p.y > INTERACT_BTN_POS.y && p.y < INTERACT_BTN_POS.y + INTERACT_BTN_POS.h) { SFX.btnTap(); tryInteract(true); }
      else if (isJoyZone(p.x, p.y) && !JOY.on) {
        JOY.on = true; JOY.id = t.identifier;
        JOY.sx = p.x; JOY.sy = p.y; JOY.dx = JOY.dy = 0;
      }
    } else { handleTap(); }
  }
}, { passive: false });

cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    // Update emote wheel selection on drag
    if (EMOTE_WHEEL.active && t.identifier === EMOTE_WHEEL.touchId) {
      const p = toV(t);
      EMOTE_WHEEL.selectedSlot = getSlotAtPoint(p.x, p.y);
    }
    if (t.identifier !== JOY.id) continue;
    const p = toV(t);
    const dx = p.x - JOY.sx, dy = p.y - JOY.sy;
    const d = Math.hypot(dx, dy) || 1, c = Math.min(d, JOY.r);
    JOY.dx = (dx / d) * (c / JOY.r);
    JOY.dy = (dy / d) * (c / JOY.r);
  }
}, { passive: false });

cv.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    // Trigger emote on wheel release
    if (EMOTE_WHEEL.active && t.identifier === EMOTE_WHEEL.touchId) {
      if (EMOTE_WHEEL.selectedSlot >= 0) triggerEmoteSlot(EMOTE_WHEEL.selectedSlot);
      EMOTE_WHEEL.active = false; EMOTE_WHEEL.touchId = null; EMOTE_WHEEL.selectedSlot = -1;
    }
    if (t.identifier === JOY.id)    { JOY.on = false; JOY.id = null; JOY.dx = JOY.dy = 0; }
    if (t.identifier === crouchId)  crouchId = null;
    if (t.identifier === runId)     { runId = null; P.running = false; }
  }
}, { passive: false });

cv.addEventListener('mousedown', e => {
  const r = cv.getBoundingClientRect();
  const x = ((e.clientX-r.left)*(cv.width/r.width)-offX)/scale;
  const y = ((e.clientY-r.top)*(cv.height/r.height)-offY)/scale;
  if (phase === PH.PLAY) {
    if (isEmoteWheelBtn(x,y)) { EMOTE_WHEEL.active=true; EMOTE_WHEEL.mouseHeld=true; EMOTE_WHEEL.selectedSlot=-1; return; }
    if (isCrouchBtn(x,y)) { triggerCrouch(); return; }
    if (isRunBtn(x,y))    { P.running = true; return; }
    if (isMuteBtn(x,y))   { toggleMute(); return; }
    if (isTargetBtn(x,y))  { triggerGunEmote(); return; }
    if (isPhoneBtn(x,y))  { openSoundCloud(); return; }
    if (handlePhoneMenuTap(x,y)) return;
    if (x > VW-116 && x < VW-16 && y > 56 && y < 96) { INVENTORY.open = !INVENTORY.open; if (INVENTORY.open) PHONE_OPEN = false; GUN_ITEM_BTN.visible=false; return; }
    if (GUN_ITEM_BTN.visible && x > GUN_ITEM_BTN.x && x < GUN_ITEM_BTN.x+GUN_ITEM_BTN.w && y > GUN_ITEM_BTN.y && y < GUN_ITEM_BTN.y+GUN_ITEM_BTN.h) { triggerGunEmote(); return; }
    if (isDumpsterTap(x,y)) { tryInteract(true); return; }
    if (INTERACT_BTN_POS.visible && x > INTERACT_BTN_POS.x && x < INTERACT_BTN_POS.x + INTERACT_BTN_POS.w && y > INTERACT_BTN_POS.y && y < INTERACT_BTN_POS.y + INTERACT_BTN_POS.h) { tryInteract(true); return; }
    tryInteract();
    if (isJoyZone(x,y)) { mouseDrag=true; JOY.on=true; JOY.sx=x; JOY.sy=y; JOY.dx=JOY.dy=0; }
  } else handleTap();
});
cv.addEventListener('mouseup', () => {
  if (EMOTE_WHEEL.mouseHeld) {
    if (EMOTE_WHEEL.selectedSlot >= 0) triggerEmoteSlot(EMOTE_WHEEL.selectedSlot);
    EMOTE_WHEEL.active=false; EMOTE_WHEEL.mouseHeld=false; EMOTE_WHEEL.selectedSlot=-1;
  }
  mouseDrag=false; JOY.on=false; JOY.dx=JOY.dy=0; P.running=false;
});
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  const x = ((e.clientX-r.left)*(cv.width/r.width)-offX)/scale;
  const y = ((e.clientY-r.top)*(cv.height/r.height)-offY)/scale;
  if (EMOTE_WHEEL.mouseHeld) { EMOTE_WHEEL.selectedSlot = getSlotAtPoint(x, y); }
  if (!mouseDrag) return;
  const dx=x-JOY.sx, dy=y-JOY.sy, d=Math.hypot(dx,dy)||1, c=Math.min(d,JOY.r);
  JOY.dx=(dx/d)*(c/JOY.r); JOY.dy=(dy/d)*(c/JOY.r);
});

window.addEventListener('keydown', e => {
  KEYS[e.key] = true;
  if ((e.key===' '||e.key==='c') && phase===PH.PLAY) triggerCrouch();
  if ((e.key==='e'||e.key==='E') && phase===PH.PLAY) tryInteract();
  if ((e.key==='Shift') && phase===PH.PLAY) P.running = true;
  if ((e.key==='b'||e.key==='B') && phase===PH.PLAY) INVENTORY.open = !INVENTORY.open;
  if (phase!==PH.PLAY) handleTap();
});
window.addEventListener('keyup', e => {
  KEYS[e.key]=false;
  if (e.key==='Shift') P.running = false;
});

// ─── Game control ─────────────────────────────────────────────────────────────
function startGame() {
  phase = PH.PLAY;
  // Girls start IN FRONT of bins (higher wz = closer to camera = visible on camera side)
  P.wx=0.62; P.wz=0.65; P.renderWx=0.62; P.renderWz=0.65;
  P.vwx=P.vwz=0; P.crouch=true; P.crouchLerp=1; P.det=0; P.catches=0;
  P.walkTimer=0; P.walkFrame=0; P.walkStep=0; P.moving=false; P.running=false;
  P.transSeq=null; P.transFrame=0; P.transTimer=0;
  P.sqIdleTimer=0; P.sqIdleActive=false; P.sqIdleFrame=0; P.sqIdleFrameTimer=0;
  P.sqWalkTimer=0; P.sqWalkStep=0;
  P.standIdleTimer=0; P.standIdleActive=false; P.standIdleFrame=0; P.standIdleFrameTimer=0;
  P.standIdleSeq=null; P.standIdleNext=2.5;
  P.danceActive=false; P.danceFrame=0; P.danceTimer=0; P.danceElapsed=0; P.queuedEmoteIdx=-1;
  P.shockActive=false; P.shockFrame=0; P.shockTimer=0;
  NPC._stepState='idle'; NPC._stepCooldown=0;
  NPC._plantedWx = NPC.wx; NPC._plantedWz = NPC.wz;
  NPC.gunEmoteActive=false; NPC.gunEmoteFrame=0; NPC.gunEmoteTimer=0; NPC._gunEmoteSeq=SIERRA_GUN_EMOTE;
  P.lastMvx=0; P.lastMvz=1;
  NPC.wx=0.80; NPC.wz=0.62; NPC.renderWx=0.80; NPC.renderWz=0.62;
  NPC.targetWx=0.80; NPC.targetWz=0.62; NPC.crouchLerp=1;
  NPC.walkTimer=0; NPC.walkFrame=0; NPC.walkStep=0; NPC.moving=false;
  NPC.lastMvx=0; NPC.lastMvz=1;
  CAR.la=0; CAR.ldir=1; CAR.ft=0;
  isCaught=false; catchFlash=0;
}
function resetGame() {
  phase=PH.TITLE; pulse=0; dlgIdx=0; winDlgIdx=0; endTimer=0;
  LATCH_CLIPS.forEach(c => c.played = false);
  MISSION_DUMP.state='closed'; MISSION_DUMP.frame=0; MISSION_DUMP.timer=0;
  INVENTORY.items=[]; INVENTORY.open=false; INVENTORY.anim=0;
}

// ─── Update ───────────────────────────────────────────────────────────────────
function inCover() {
  for (const z of COVERS) {
    if (P.wx>=z.wxMin && P.wx<=z.wxMax && P.wz>=z.wzMin && P.wz<=z.wzMax) return true;
  }
  return false;
}

function inSpotlight() {
  // Car is at (CAR.wx, CAR.wz). Its light sweeps horizontally.
  const dwx = P.wx - (CAR.wx + CAR.la * 0.30);
  const dwz = P.wz - CAR.wz;
  // Must be "in front of" the car (higher wz = closer to camera)
  if (dwz < 0 || dwz > CAR.coneWz) return false;
  // Cone narrows toward car, widens toward camera proportional to depth
  const coneW = CAR.coneWx * (dwz / CAR.coneWz);
  return Math.abs(dwx) < coneW;
}

let lastTs = 0;
function update(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  pulse += dt;

  // INTRO = loading screen — max 3s wait, tap-able after 1.5s
  if (phase === PH.INTRO) {
    loadingElapsed += dt;
    loadingDotTimer += dt;
    if (loadingDotTimer > 0.5) { loadingDotTimer = 0; loadingDots = (loadingDots + 1) % 4; }
    if (videosReady || loadingElapsed >= 3.0) { phase = PH.TITLE; startMusic(); }
    return;
  }

  // Crossfade video → game
  if (phase === PH.CROSSFADE) {
    crossfadeTimer += dt;
    // Fade video opacity down
    VID.style.opacity = Math.max(0, 1 - crossfadeTimer / CROSSFADE_DUR);
    if (crossfadeTimer >= CROSSFADE_DUR) {
      VID.pause();
      VID.style.display = 'none';
      VID.style.opacity = 1;
      phase = PH.PLAY;
    }
    return;
  }

  // Win flash → win dialogue
  tickWinFlash(dt);
  tickBirds(dt);
  tickClouds(dt);
  tickRats(dt);
  tickDemo(dt);

  // End card auto-replay after 8s
  if (phase === PH.END) {
    endTimer += dt;
    if (endTimer > 8) resetGame();
    return;
  }

  CAR.la += CAR.lspd * CAR.ldir * dt;
  if (Math.abs(CAR.la) > 1) CAR.ldir *= -1;
  CAR.ft += dt;

  // ─── Sierra Follow System — GRACEFUL STAGING ─────────────────────────────
  // Two girls who know each other — side by side, never stacked behind each other.

  // Target position: Sierra is BESIDE Naomi, reading the situation
  let targetOffX, targetOffZ;
  if (P.crouch) {
    // Crouching: side by side behind cover — Sierra to Naomi's right
    targetOffX =  0.20; targetOffZ =  0.02;
  } else if (P.running) {
    // Running: Sierra slightly ahead-left — she leads the way
    targetOffX = -0.20; targetOffZ = -0.14;
  } else {
    // Walking or idle: Sierra to Naomi's LEFT, same depth or slightly behind
    // This looks like two friends moving through a space together
    targetOffX = -0.20; targetOffZ = -0.04;
  }

  const rawTargetX = clamp(P.wx + targetOffX, 0.03, 0.95);
  const rawTargetZ = clamp(P.wz + targetOffZ, 0.02, 0.90);

  // Initialize planted position
  if (NPC._plantedWx === undefined) {
    NPC._plantedWx = NPC.wx;
    NPC._plantedWz = NPC.wz;
  }

  // ── Character separation — they are TWO PEOPLE, never overlap ──────────────
  const MIN_SEP = 0.16;  // minimum world-distance between characters
  const rawSepDist = Math.hypot(NPC._plantedWx - P.wx, NPC._plantedWz - P.wz);
  if (rawSepDist < MIN_SEP && rawSepDist > 0.001) {
    // Push Sierra away from Naomi along the separation vector
    const sepAngle = Math.atan2(NPC._plantedWz - P.wz, NPC._plantedWx - P.wx);
    NPC._plantedWx = P.wx + Math.cos(sepAngle) * MIN_SEP;
    NPC._plantedWz = P.wz + Math.sin(sepAngle) * MIN_SEP;
    NPC._plantedWx = clamp(NPC._plantedWx, 0.03, 0.95);
    NPC._plantedWz = clamp(NPC._plantedWz, 0.02, 0.90);
  }

  const gapToPerfect = Math.hypot(NPC._plantedWx - rawTargetX, NPC._plantedWz - rawTargetZ);
  const moveThreshold = P.running ? 0.12 : P.crouch ? 0.08 : 0.20;

  if (gapToPerfect > moveThreshold) {
    const catchSpeed = P.running ? 12.0 : 6.0;
    NPC._plantedWx = lerp(NPC._plantedWx, rawTargetX, Math.min(1, dt * catchSpeed));
    NPC._plantedWz = lerp(NPC._plantedWz, rawTargetZ, Math.min(1, dt * catchSpeed));
  }

  // Lock NPC position to planted position
  const prevNx = NPC.wx, prevNz = NPC.wz;
  NPC.wx = NPC._plantedWx;
  NPC.wz = NPC._plantedWz;

  // Obstacle resolution still applies
  const npcRes = resolveObstacles(NPC.wx, NPC.wz, prevNx, prevNz);
  NPC.wx = npcRes.wx; NPC.wz = npcRes.wz;
  NPC._plantedWx = NPC.wx; NPC._plantedWz = NPC.wz;

  // 8. Direction — Sierra faces where she's ACTUALLY moving
  const ndx = NPC.wx - prevNx, ndz = NPC.wz - prevNz;
  const nmag = Math.hypot(ndx, ndz);
  if (nmag > 0.00005) {
    const turnRate = P.running ? 12.0 : 6.0;
    NPC.lastMvx = lerp(NPC.lastMvx, ndx / nmag, Math.min(1, dt * turnRate));
    NPC.lastMvz = lerp(NPC.lastMvz, ndz / nmag, Math.min(1, dt * turnRate));
  } else if (!P.crouch && !P.moving) {
    const toNaomiX = P.wx - NPC.wx;
    const toNaomiZ = P.wz - NPC.wz;
    const toMag = Math.hypot(toNaomiX, toNaomiZ) || 1;
    NPC.lastMvx = lerp(NPC.lastMvx, toNaomiX / toMag, dt * 1.5);
    NPC.lastMvz = lerp(NPC.lastMvz, toNaomiZ / toMag, dt * 1.5);
  }

  // Sierra plants and stays still — animations fire from the idle pool only, not from movement

  // Player world-space movement from joystick
  let mx = 0, mz = 0;
  if (JOY.on) { mx = JOY.dx; mz = JOY.dy; }
  if (KEYS['ArrowLeft'] || KEYS['a']) mx -= 1;
  if (KEYS['ArrowRight']|| KEYS['d']) mx += 1;
  if (KEYS['ArrowUp']   || KEYS['w']) mz -= 1;
  if (KEYS['ArrowDown'] || KEYS['s']) mz += 1;

  const mag = Math.hypot(mx, mz) || 1;
  if (mx || mz) { mx /= mag; mz /= mag; P.lastMvx = mx; P.lastMvz = mz; }

  // Detect micro-step: pick sequence based on dominant input direction
  const inputMag = Math.hypot(mx, mz);
  if (inputMag > 0.05 && !P.crouch && !P.transSeq) {
    let seq = NAOMI_STEP_SEQ; // default: forward-facing shuffle
    if (mz < -0.4 && Math.abs(mz) > Math.abs(mx))      seq = NAOMI_STEP_BACK;
    else if (mx >  0.4 && Math.abs(mx) > Math.abs(mz)) seq = NAOMI_STEP_RIGHT;
    else if (mx < -0.4 && Math.abs(mx) > Math.abs(mz)) seq = NAOMI_STEP_LEFT;
    P.transSeq = seq; P.transFrame = 0; P.transTimer = 0;
  }

  // Tick Naomi's transition sequence
  if (P.transSeq) {
    P.transTimer += dt;
    const cur = P.transSeq[P.transFrame];
    if (P.transTimer >= cur.dur) {
      P.transTimer = 0;
      P.transFrame++;
      if (P.transFrame >= P.transSeq.length) {
        P.transSeq = null;
        // Fire any emote that was queued while crouching
        if (P.queuedEmoteIdx >= 0) {
          const qi = P.queuedEmoteIdx; P.queuedEmoteIdx = -1;
          triggerEmoteSlot(qi);
        }
      }
    }
  }

  // Read Shift from KEYS too (held keyboard run)
  if (KEYS['Shift']) P.running = true;

  const spd = P.crouch ? 0.32 : P.running ? 1.0 : 0.52;  // crouch / run / walk
  const prevPx = P.wx, prevPz = P.wz;
  P.wx = clamp(P.wx + mx * P.wxSpeed * spd * dt, 0.02, 0.98);
  P.wz = clamp(P.wz + mz * P.wzSpeed * spd * dt, 0.01, 0.98);

  // Resolve player vs obstacles — slide around bins instead of stopping
  const pRes = resolveObstacles(P.wx, P.wz, prevPx, prevPz);
  P.wx = clamp(pRes.wx, 0.02, 0.98);
  P.wz = clamp(pRes.wz, 0.01, 0.98);

  // Smooth crouch interpolation — player and Sierra each independent
  // During CROUCH_IN: tie crouchLerp to animation frame progress so height scale
  // and artwork change at exactly the same rate — no shrink-then-land artifact
  const isCrouchingIn = P.crouch && P.transSeq &&
    (P.transSeq === NAOMI_CROUCH_IN || P.transSeq === NAOMI_CROUCH_IN_LEFT);
  if (isCrouchingIn && P.transSeq.length > 0) {
    const frameDur = P.transSeq[P.transFrame] ? P.transSeq[P.transFrame].dur : 0.07;
    P.crouchLerp = Math.min(1, (P.transFrame + P.transTimer / frameDur) / P.transSeq.length);
  } else {
    P.crouchLerp = lerp(P.crouchLerp, P.crouch ? 1 : 0, Math.min(1, dt * 9));
  }
  NPC.crouchLerp = lerp(NPC.crouchLerp, P.crouch ? 1 : 0, Math.min(1, dt * 9));

  // Smooth render positions — tiny lag makes motion feel organic
  P.renderWx = lerp(P.renderWx, P.wx, Math.min(1, dt * 14));
  P.renderWz = lerp(P.renderWz, P.wz, Math.min(1, dt * 14));
  NPC.renderWx = lerp(NPC.renderWx, NPC.wx, Math.min(1, dt * 14));
  NPC.renderWz = lerp(NPC.renderWz, NPC.wz, Math.min(1, dt * 14));

  // Idle phase ticks (breathing animation)
  P.idlePhase   = (P.idlePhase   + dt) % (Math.PI * 200);
  NPC.idlePhase = (NPC.idlePhase + dt) % (Math.PI * 200);





  // Footstep sound effects
  tickFootsteps(dt, P.moving, P.running, P.crouch);

  // ─── Naomi squat idle fidget ───────────────────────────────────────────────
  const sqMoving = !!(mx || mz);
  if (P.crouch && !sqMoving && !P.transSeq && !P.sqIdleActive) {
    P.sqIdleTimer += dt;
    if (P.sqIdleTimer >= 6.0) {
      P.sqIdleActive = true; P.sqIdleFrame = 0; P.sqIdleFrameTimer = 0;
      P.sqIdleTimer = 0;
    }
  } else if (!P.crouch || sqMoving || P.transSeq) {
    P.sqIdleTimer = 0; P.sqIdleActive = false; P.sqIdleFrame = 0;
  }

  if (P.sqIdleActive) {
    P.sqIdleFrameTimer += dt;
    if (P.sqIdleFrameTimer >= NAOMI_SQUAT_IDLE[P.sqIdleFrame].dur) {
      P.sqIdleFrameTimer = 0;
      P.sqIdleFrame++;
      if (P.sqIdleFrame >= NAOMI_SQUAT_IDLE.length) {
        P.sqIdleActive = false; P.sqIdleFrame = 0; P.sqIdleTimer = 0;
      }
    }
  }

  // ─── Naomi standing idle — smart randomizer (2-4s, picks from action pool) ──
  const standStill = !P.moving && !P.crouch && !P.transSeq && !P.standIdleActive;
  if (standStill) {
    P.standIdleTimer += dt;
    if (P.standIdleTimer >= P.standIdleNext) {
      // Pick action from pool — varied timing feels natural
      const pool = NAOMI_IDLE_POOL;
      P.standIdleSeq   = pool[Math.floor(Math.random() * pool.length)];
      P.standIdleActive = true;
      P.standIdleFrame  = 0;
      P.standIdleFrameTimer = 0;
      P.standIdleTimer  = 0;
      // Next action fires in 2-4s — randomize so actions don't feel robotic
      P.standIdleNext = 2.0 + Math.random() * 2.0;
    }
  } else if (!P.moving && !P.crouch && !P.transSeq && P.standIdleActive) {
    // Run the active sequence
    const seq = P.standIdleSeq || NAOMI_STAND_IDLE;
    P.standIdleFrameTimer += dt;
    if (P.standIdleFrameTimer >= seq[P.standIdleFrame].dur) {
      P.standIdleFrameTimer = 0;
      P.standIdleFrame++;
      if (P.standIdleFrame >= seq.length) {
        P.standIdleActive = false; P.standIdleFrame = 0;
        // Short cooldown before next action can fire
        P.standIdleTimer = 0;
        P.standIdleNext = 2.0 + Math.random() * 2.0;
      }
    }
  } else if (P.moving || P.crouch || P.transSeq) {
    P.standIdleTimer = 0; P.standIdleActive = false; P.standIdleFrame = 0;
  }

  // ─── Mission dumpster tick ────────────────────────────────────────────────
  if (MISSION_DUMP.state === 'opening') {
    MISSION_DUMP.timer += dt;
    const cur = OPENING_SEQ[MISSION_DUMP.frame];
    if (MISSION_DUMP.timer >= cur.dur) {
      MISSION_DUMP.timer = 0;
      MISSION_DUMP.frame++;
      if (MISSION_DUMP.frame >= OPENING_SEQ.length) {
        MISSION_DUMP.state = 'open_key';
        MISSION_DUMP.frame = 0;
      }
    }
  }
  // open_key: hold static on last opening frame — no looping animation

  // Inventory bag animation
  const bagOpen = INVENTORY.open;
  INVENTORY.anim = lerp(INVENTORY.anim, bagOpen ? 1 : 0, Math.min(1, dt * 10));

  // Walk animation tick — 3-frame cycle: neutral(0) → a(1) → neutral(0) → b(2)
  P.moving = !!(mx || mz);
  if (P.moving) {
    const fps = P.crouch ? 5.0 : P.running ? 13.0 : 7.0;
    P.walkTimer += dt * fps;
    if (P.walkTimer >= 1) {
      P.walkTimer -= 1;
      if (P.running) {
        P.walkStep = (P.walkStep + 1) % 2;
        P.walkFrame = P.walkStep === 0 ? 1 : 2;
      } else {
        P.walkStep = (P.walkStep + 1) % 4;
        P.walkFrame = [0, 1, 0, 2][P.walkStep];
      }
    }
    // Squat walk cycle — advances independently at ~4fps
    if (P.crouch) {
      P.sqWalkTimer += dt * 4.5;
      if (P.sqWalkTimer >= 1) {
        P.sqWalkTimer -= 1;
        P.sqWalkStep = (P.sqWalkStep + 1) % NAOMI_SQUAT_WALK.length;
      }
    }
  } else {
    P.walkTimer = 0; P.walkStep = 0; P.walkFrame = 0;
    if (!P.crouch) { P.sqWalkTimer = 0; P.sqWalkStep = 0; }
  }

  // NPC walk animation tick — use actual position change, not target distance
  // (target shifts every frame from sideWeave so distance-to-target is never zero)
  const npcActualMove = Math.hypot(NPC.wx - NPC.renderWx, NPC.wz - NPC.renderWz);
  NPC.moving = npcActualMove > 0.003;
  if (NPC.moving) {
    NPC.walkTimer += dt * 7.0;
    if (NPC.walkTimer >= 1) {
      NPC.walkTimer -= 1;
      NPC.walkStep = (NPC.walkStep + 1) % 4;
      NPC.walkFrame = [0, 1, 0, 2][NPC.walkStep];
    }
  } else {
    NPC.walkTimer = 0; NPC.walkStep = 0; NPC.walkFrame = 0;
  }

  // ─── Sierra gun emote tick ────────────────────────────────────────────────
  if (NPC.gunEmoteActive) {
    NPC.gunEmoteTimer += dt;
    if (NPC.gunEmoteTimer >= NPC._gunEmoteSeq[NPC.gunEmoteFrame].dur) {
      NPC.gunEmoteTimer = 0;
      NPC.gunEmoteFrame++;
      if (NPC.gunEmoteFrame >= SIERRA_GUN_EMOTE.length) {
        NPC.gunEmoteActive = false; NPC.gunEmoteFrame = 0;
      }
    }
  }

  // ─── Sierra dance tick — loops until movement or crouch cancels ────────────
  if (NPC.danceActive) {
    // Cancel if Naomi moves or crouches
    if (P.moving || P.crouch) {
      NPC.danceActive = false; NPC.danceFrame = 0; NPC.danceTimer = 0;
    } else {
      NPC.danceTimer += dt;
      if (NPC.danceTimer >= SIERRA_DANCE_SEQ[NPC.danceFrame].dur) {
        NPC.danceTimer = 0;
        NPC.danceFrame = (NPC.danceFrame + 1) % SIERRA_DANCE_SEQ.length; // loop
      }
    }
  }

  // ─── Naomi dance tick — mirrors Sierra, cancels on movement/crouch/timeout ───
  if (P.danceActive) {
    P.danceElapsed += dt;
    const danceExpired = P.danceElapsed >= 6.0;
    if (P.moving || P.crouch || danceExpired) {
      P.danceActive = false; P.danceFrame = 0; P.danceTimer = 0; P.danceElapsed = 0;
      NPC.danceActive = false; NPC.danceFrame = 0; NPC.danceTimer = 0;
      if (DANCE_AUDIO) { DANCE_AUDIO.pause(); DANCE_AUDIO.currentTime = 0; }
      if (SC_WIDGET && scReady) SC_WIDGET.setVolume(100);
    } else {
      P.danceTimer += dt;
      if (P.danceTimer >= NAOMI_DANCE_SEQ[P.danceFrame].dur) {
        P.danceTimer = 0;
        P.danceFrame = (P.danceFrame + 1) % NAOMI_DANCE_SEQ.length;
      }
    }
  }

  // ─── Sierra micro-step: fires when she's settled and needs to adjust ────────
  // She does a tiny forward step every 1.5-3s when standing still near Naomi
  const sierraSettled = !NPC.moving && !P.crouch && !NPC.gumActive && !NPC.stepSeq;
  if (sierraSettled) {
    NPC.stepIdleTimer += dt;
    if (NPC.stepIdleTimer >= NPC.stepNext) {
      // Pick from pool — forward most common, side steps add variety
      NPC.stepSeq   = SIERRA_STEP_POOL[Math.floor(Math.random() * SIERRA_STEP_POOL.length)];
      NPC.stepFrame = 0;
      NPC.stepTimer = 0;
      NPC.stepIdleTimer = 0;
      NPC.stepNext  = 3.5 + Math.random() * 2.5; // 3.5-6s — she plants and stays
    }
  } else if (NPC.moving || P.crouch) {
    NPC.stepIdleTimer = 0; NPC.stepSeq = null; NPC.stepFrame = 0;
  }

  if (NPC.stepSeq) {
    NPC.stepTimer += dt;
    if (NPC.stepTimer >= NPC.stepSeq[NPC.stepFrame].dur) {
      NPC.stepTimer = 0;
      NPC.stepFrame++;
      if (NPC.stepFrame >= NPC.stepSeq.length) {
        NPC.stepSeq = null; NPC.stepFrame = 0;
      }
    }
  }

  // ─── Sierra gum idle animation ────────────────────────────────────────────
  const GUM_TRIGGER = 5.0;

  if (P.crouch && !NPC.moving && !NPC.gumActive) {
    NPC.idleTimer += dt;
    if (NPC.idleTimer >= GUM_TRIGGER) {
      NPC.gumActive = true; NPC.gumFrame = 0; NPC.gumFrameTimer = 0;
      NPC.idleTimer = 0;
    }
  } else if (!P.crouch || NPC.moving) {
    NPC.gumActive = false; NPC.gumFrame = 0; NPC.gumFrameTimer = 0;
    NPC.gumFade = 0; NPC.gumFading = false;
    NPC.idleTimer = 0;
  }

  if (NPC.gumActive) {
    NPC.gumFrameTimer += dt;
    if (NPC.gumFrameTimer >= GUM_SEQ[NPC.gumFrame].dur) {
      NPC.gumFrameTimer = 0;
      NPC.gumFrame++;
      if (NPC.gumFrame >= GUM_SEQ.length) {
        NPC.gumActive = false; NPC.gumFrame = 0; NPC.idleTimer = 0;
      }
    }
  }

  // Derive screen pos for this frame
  const sp = w2s(P.wx, P.wz);
  P.sx = sp.x; P.sy = sp.y;

  // Detection
  if (inSpotlight() && !inCover() && !isCaught) {
    P.det = Math.min(1, P.det + (P.crouch ? 0.25 : 1.0) * dt);
  } else {
    P.det = Math.max(0, P.det - 0.4 * dt);
  }

  // ─── Spotlight shock animation ────────────────────────────────────────────
  const shouldShock = P.det > 0 && !isCaught;
  if (shouldShock !== P.shockActive) {
    P.shockActive = shouldShock;
    P.shockFrame = 0; P.shockTimer = 0;  // reset on enter/exit
  }
  if (P.shockActive) {
    P.shockTimer += dt;
    if (P.shockTimer >= NAOMI_SHOCK_SEQ[P.shockFrame].dur) {
      P.shockTimer = 0;
      P.shockFrame = (P.shockFrame + 1) % NAOMI_SHOCK_SEQ.length;
    }
  }

  if (P.det >= 1 && !isCaught) {
    isCaught = true; catchFlash = 1; P.det = 0; P.catches++;
    SFX.caught(); SFX.spotlight();
    if (P.catches >= P.maxCatches) {
      setTimeout(function() { phase = PH.CAUGHT; playCaughtVideo(); }, 1400);
    } else {
      setTimeout(() => { isCaught = false; }, 1600);
    }
  }
  if (catchFlash > 0) catchFlash = Math.max(0, catchFlash - dt * 2.5);

  // Win — only if Naomi has the key
  if (hasItem('key') &&
      P.wx >= WIN.wxMin && P.wx <= WIN.wxMax &&
      P.wz >= WIN.wzMin && P.wz <= WIN.wzMax) {
    phase = PH.WIN;
    SFX.win();
    // Start win video sequence immediately — plays part1 → part2 → title
    setTimeout(playWinSequence, 600);
  }

  // Block the left wall exit zone if no key — push Naomi back out
  if (!hasItem('key') &&
      P.wx <= WIN.wxMax + 0.04 &&
      P.wz >= WIN.wzMin && P.wz <= WIN.wzMax + 0.10) {
    P.wx = WIN.wxMax + 0.05;
    P.renderWx = Math.max(P.renderWx, WIN.wxMax + 0.04);
  }
}

// Trigger win dialogue after a brief WIN flash
let winFlashTimer = 0;
function tickWinFlash(dt) {
  if (phase !== PH.WIN) return;
  winFlashTimer += dt;
  if (winFlashTimer > 1.4) { phase = PH.WIN_DLG; winFlashTimer = 0; winDlgIdx = 0; }
}

function tickBirds(dt) {
  if (phase !== PH.PLAY) return;
  BIRDS.forEach(function(b) {

    if (b.state === 'idle') {
      b.idleTimer += dt;
      if (b.idleTimer >= b.nextEntry) {
        b.idleTimer = 0;
        b.nextEntry = 180 + Math.random() * 30;  // ~3 min cadence
        birdLaunch(b);
      }
      return;
    }

    b.onScreenTimer += dt;

    // After 55s on screen start exiting regardless of state
    if (b.onScreenTimer > 55 && b.state !== 'exiting') {
      b.state = 'exiting';
      // Fly toward nearest off-screen edge
      b.waypointX = b.x < VW/2 ? -100 : VW + 100;
      b.waypointY = 40 + Math.random() * 80;
      birdPickSpeed(b);
    }

    if (b.state === 'flying') {
      var dx = b.waypointX - b.x, dy = b.waypointY - b.y;
      if (Math.sqrt(dx*dx+dy*dy) < 35) {
        // Reached waypoint
        if (b.waypointsLeft > 0 && b.onScreenTimer < 35) {
          birdPickWaypoint(b);
          birdPickSpeed(b);
        } else if (b.onScreenTimer < 48) {
          // Land on a random perch spot
          var spot = BIRD_PERCH_SPOTS[Math.floor(Math.random()*BIRD_PERCH_SPOTS.length)];
          b.waypointX = spot.sx; b.waypointY = spot.sy;
          b.perchSpot = spot;
          birdPickSpeed(b);
          b.state = 'landing';
        } else {
          b.state = 'exiting';
          b.waypointX = b.x < VW/2 ? -100 : VW + 100;
          b.waypointY = 40 + Math.random() * 80;
          birdPickSpeed(b);
        }
      }
      // Steer smoothly toward waypoint
      var tdx = b.waypointX-b.x, tdy = b.waypointY-b.y;
      var td = Math.sqrt(tdx*tdx+tdy*tdy)||1, spd = 130;
      b.vx += ((tdx/td)*spd - b.vx) * Math.min(1, dt*3.5);
      b.vy += ((tdy/td)*spd - b.vy) * Math.min(1, dt*3.5);
      b.flipH = b.vx < 0;
      b.seq = Math.abs(b.vy) > Math.abs(b.vx)*1.4 ? BIRD_FRONT_SEQ : BIRD_FLY_SEQ;
      b.x += b.vx*dt; b.y += b.vy*dt;
    }

    if (b.state === 'landing') {
      var dx2=b.waypointX-b.x, dy2=b.waypointY-b.y;
      b.seq = BIRD_FRONT_SEQ;
      b.x += b.vx*dt; b.y += b.vy*dt;
      if (Math.sqrt(dx2*dx2+dy2*dy2) < 20) {
        b.x = b.waypointX; b.y = b.waypointY;
        b.perchTimer = 0;
        b.perchDur = 12 + Math.random() * 18;  // sit 12-30s
        b.state = 'perched';
      }
    }

    if (b.state === 'perched') {
      b.perchTimer += dt;
      if (b.perchTimer > b.perchDur || b.onScreenTimer > 48) {
        // Take off — pick a new waypoint in sky then eventually exit
        b.waypointsLeft = 1;
        birdPickWaypoint(b);
        birdPickSpeed(b);
        b.state = 'flying';
      }
    }

    if (b.state === 'exiting') {
      b.x += b.vx*dt; b.y += b.vy*dt;
      b.seq = BIRD_FLY_SEQ;
      b.flipH = b.vx < 0;
      if (b.x < -150 || b.x > VW+150) {
        b.state = 'idle';
        b.idleTimer = 0;
      }
    }

    // Advance animation frame
    var seq = b.seq || BIRD_FLY_SEQ;
    if (b.frame >= seq.length) b.frame = 0;
    b.frameTimer += dt;
    if (b.frameTimer >= seq[b.frame].dur) {
      b.frameTimer = 0;
      b.frame = (b.frame + 1) % seq.length;
    }
  });
}

// ─── Demo mode controller ────────────────────────────────────────────────────
let _demoT = 0, _demoInteracted = false, _demoTapTimer = 0;
function tickDemo(dt) {
  if (!DEMO_MODE) return;

  // Cap detection — show shock reaction but never trigger game-over
  if (P.det > 0.88) P.det = 0.88;

  // Auto-tap through title/intro screens
  if (phase !== PH.PLAY) {
    _demoTapTimer += dt;
    if (_demoTapTimer > 1.2) { handleTap(); _demoTapTimer = 0; }
    return;
  }

  _demoT += dt;
  const t = _demoT;

  // Auto-click trash piles during mini-game
  if (TRASH_GAME_EL && TRASH_GAME_EL.style.display !== 'none') {
    _demoTapTimer += dt;
    if (_demoTapTimer > 1.8) {
      _demoTapTimer = 0;
      var pile = TRASH_GAME_EL.querySelector('.trash-pile:not(.searched)');
      if (pile) pile.click();
    }
    JOY.dx = 0; JOY.dy = 0;
    return;
  }

  // Scripted movement timeline (JOY without JOY.on so no joystick renders)
  if (t < 1.0) {
    if (P.crouch) triggerCrouch();         // stand up immediately
    JOY.dx = 0; JOY.dy = 0;
  } else if (t < 4.5) {
    JOY.dx =  0.40; JOY.dy = -0.35;       // walk right + forward into alley
  } else if (t < 7.5) {
    JOY.dx = -0.30; JOY.dy = -0.40;       // sweep left, deeper in
  } else if (t < 9.5) {
    JOY.dx =  0.45; JOY.dy =  0.10;       // dodge right (light hits here)
  } else if (t < 11.5) {
    JOY.dx = -0.20; JOY.dy = -0.30;       // settle, head toward dumpster
  } else if (t < 12.2) {
    JOY.dx = 0; JOY.dy = 0;               // stop, face dumpster
  } else if (!_demoInteracted) {
    _demoInteracted = true;
    tryInteract(true);                     // open dumpster
  } else if (MISSION_DUMP.state === 'open_key' || MISSION_DUMP.state === 'open_empty') {
    if (t < 22.0) {
      JOY.dx = -0.30; JOY.dy = -0.45;     // walk toward door with key
    } else {
      // Loop demo from beginning
      _demoT = 0; _demoInteracted = false;
      resetGame();
    }
  }
}

// ─── Drawing: background ─────────────────────────────────────────────────────
function drawBirds() {
  BIRDS.forEach(function(b) {
    if (b.state === 'idle') return;
    var key, bh;
    if (b.state === 'perched') {
      // Alternate stand/alert for a subtle head-bob every few seconds
      key = (Math.floor(b.perchTimer * 0.5) % 2 === 0) ? 'bird_stand' : 'bird_alert';
      bh  = 46 * (b.perchSpot ? b.perchSpot.scale : 0.55);
    } else {
      var seq = b.seq || BIRD_FLY_SEQ;
      var fi  = Math.min(b.frame, seq.length - 1);
      key = seq[fi].key;
      bh  = 52;
    }
    var spr = SPR[key] || IMG[key];
    if (!spr) return;
    var bw = bh * (spr.width / spr.height);
    cx.save();
    cx.translate(b.x, b.y);
    if (b.flipH) cx.scale(-1, 1);
    cx.drawImage(spr, -bw/2, -bh/2, bw, bh);
    cx.restore();
  });
}

// Cover-fill the entire canvas with the scene before the game transform.
// Uses CSS background-size:cover logic so every pixel is filled — no black bars anywhere.
// drawBg() renders the correctly scaled game version on top, covering the center area.
function drawExtendedBg() {
  var img = IMG['scene'];
  if (!img || !img.naturalWidth) return;
  var coverScale = Math.max(cv.width / img.naturalWidth, cv.height / img.naturalHeight);
  var bw = img.naturalWidth  * coverScale;
  var bh = img.naturalHeight * coverScale;
  var bx = (cv.width  - bw) / 2;
  var by = (cv.height - bh) / 2;
  cx.drawImage(img, bx, by, bw, bh);
}

function drawBg(darken = 0) {
  // Scene is drawn by drawExtendedBg() cover-fill — no redraw here to avoid seam.
  // Fallback gradient only when scene hasn't loaded yet.
  if (!IMG['scene']) {
    const g = cx.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,'#09031a'); g.addColorStop(1,'#1a0828');
    cx.fillStyle = g; cx.fillRect(0,0,VW,VH);
  }
  if (darken > 0) {
    cx.save(); cx.globalAlpha = darken;
    cx.fillStyle = '#000'; cx.fillRect(0,0,VW,VH);
    cx.restore();
  }
}

// Patrol car spotlight cone drawn in world-perspective space
function drawSpotlight() {
  // Car screen position
  const cs = w2s(CAR.wx, CAR.wz);
  const ox = cs.x, oy = cs.y;

  // The light sweeps forward (toward near camera, in screen = downward)
  // Two boundary rays of the cone
  const nearWz = clamp(CAR.wz + CAR.coneWz, 0, 1);
  const sweep = CAR.la * 0.30;
  const lEdge = w2s(CAR.wx + sweep - CAR.coneWx * 0.85, nearWz);
  const rEdge = w2s(CAR.wx + sweep + CAR.coneWx * 0.85, nearWz);
  const mEdge = w2s(CAR.wx + sweep, nearWz);

  const g = cx.createRadialGradient(ox, oy, 0, mEdge.x, mEdge.y, 180);
  g.addColorStop(0, 'rgba(255,250,190,0.42)');
  g.addColorStop(0.5,'rgba(255,246,160,0.14)');
  g.addColorStop(1, 'rgba(255,240,130,0)');

  cx.save();
  cx.beginPath();
  cx.moveTo(ox, oy);
  cx.lineTo(lEdge.x, lEdge.y);
  cx.lineTo(rEdge.x, rEdge.y);
  cx.closePath();
  cx.fillStyle = g;
  cx.fill();
  cx.restore();
}

function drawCar() {
  const cs  = w2s(CAR.wx, CAR.wz);
  const s   = dScale(CAR.wz) * 3.0;
  const spr = SPR['police'] || IMG['police'];

  const baseW = 220, baseH = 120;
  const sw = baseW * s, sh = baseH * s * SQUISH;
  const x = cs.x, y = cs.y;

  cx.save();
  cx.translate(x, y);

  if (spr) {
    cx.scale(-1, 1);
    cx.drawImage(spr, -sw / 2, -sh, sw, sh);
    cx.scale(-1, 1);
  } else {
    cx.fillStyle = '#111820';
    cx.fillRect(-sw / 2, -sh, sw, sh);
  }

  // Police light strobe overlay
  const rb = Math.sin(CAR.ft * 6) > 0;
  cx.globalAlpha = 0.5;
  cx.fillStyle = rb ? '#ff000044' : '#0033ff44';
  cx.beginPath();
  cx.ellipse(0, -sh * 0.82, sw * 0.25, sh * 0.18, 0, 0, Math.PI * 2);
  cx.fill();

  cx.restore();
}

// Draw a single dumpster at world position
function drawDumpster(wx, wz, scale2, spriteKey) {
  const key = spriteKey || 'dumpster';
  const img = IMG[key] || IMG['dumpster'];
  if (!img || !img.naturalWidth || !img.naturalHeight) return;
  const ar  = img.naturalWidth / img.naturalHeight;
  const ds  = w2s(wx, wz);
  const sc  = dScale(wz) * (scale2 || 2.0);
  const dh  = 220 * sc * SQUISH;
  if (!isFinite(dh) || !isFinite(ar)) return;
  cx.drawImage(img, ds.x - dh*ar*0.46, ds.y - dh*0.92, dh*ar, dh);
}

// Depth-sorted render: bins AND characters in one list so depth is always correct
function drawEntities() {
  const ents = [
    { type:'bin', wz: DUMP_B.wz, draw: () => drawDumpster(DUMP_B.wx, DUMP_B.wz, 2.4) },
    { type:'bin', wz: DUMP_A.wz, draw: () => {
      // Mission dumpster — show correct state sprite
      let sprKey = 'dumpster_closed';
      if (MISSION_DUMP.state === 'closed')     sprKey = 'dumpster_closed';
      if (MISSION_DUMP.state === 'opening')    sprKey = OPENING_SEQ[MISSION_DUMP.frame]?.key || 'dumpster_closed';
      if (MISSION_DUMP.state === 'open_key')   sprKey = 'dumpster_open_key_d';  // static hold
      if (MISSION_DUMP.state === 'open_empty') sprKey = 'dumpster_open_empty';
      drawDumpster(DUMP_A.wx, DUMP_A.wz, 2.4, sprKey);
    }},
    { type:'npc',    wz: NPC.renderWz, draw: () => {
      const gumSprKey = NPC.gumActive ? GUM_SEQ[NPC.gumFrame].key : null;
      // Dance > gun emote > step > gum priority
      const sierraSprKey = NPC.danceActive
        ? SIERRA_DANCE_SEQ[NPC.danceFrame].key
        : NPC.gunEmoteActive
          ? NPC._gunEmoteSeq[NPC.gunEmoteFrame].key
          : (NPC.stepSeq ? NPC.stepSeq[NPC.stepFrame].key : gumSprKey);
      drawChar('sierra', NPC.renderWx, NPC.renderWz, NPC.lastMvx, NPC.lastMvz, NPC.walkFrame, P.crouch, NPC.crouchLerp, NPC.idlePhase, sierraSprKey, 0, 1.22, NPC.moving);


    }},
    { type:'player', wz: P.renderWz,   draw: () => {
      drawPlayerDetectGlow();
      // Shock overrides everything — active whenever in spotlight beam
      let naomiSprKey = null;
      if (P.shockActive) {
        const fi = Math.min(P.shockFrame, NAOMI_SHOCK_SEQ.length - 1);
        naomiSprKey = NAOMI_SHOCK_SEQ[fi].key;
      }
      if (!naomiSprKey) naomiSprKey = P.danceActive ? NAOMI_DANCE_SEQ[P.danceFrame].key : null;
      if (!naomiSprKey) naomiSprKey = P.transSeq ? P.transSeq[P.transFrame].key : null;
      if (!naomiSprKey && P.sqIdleActive) naomiSprKey = NAOMI_SQUAT_IDLE[P.sqIdleFrame].key;
      if (!naomiSprKey && P.standIdleActive && P.standIdleSeq) {
        naomiSprKey = P.standIdleSeq[P.standIdleFrame] ? P.standIdleSeq[P.standIdleFrame].key : null;
      }
      if (!naomiSprKey && P.crouch && P.moving) {
        const sqSeq = P.lastMvx < -0.1 ? NAOMI_SQUAT_WALK_LEFT : NAOMI_SQUAT_WALK;
        naomiSprKey = sqSeq[P.sqWalkStep];
      }
      drawChar('naomi', P.renderWx, P.renderWz, P.lastMvx, P.lastMvz, P.walkFrame, P.crouch, P.crouchLerp, P.idlePhase, naomiSprKey, 0, undefined, P.moving);

    }},
  ];
  ents.sort((a, b) => a.wz - b.wz);
  for (const e of ents) e.draw();
}

// ─── Character rendering ──────────────────────────────────────────────────────
// Pick the right sprite key + flip flag based on movement direction and state
// walkFrame: 0=_a, 1=_b. crouch overrides to _squat.
function getSpriteKey(charKey, mvx, mvz, walkFrame, crouch, isMoving) {
  // Crouching idle → squat. Crouching + moving → walk frames (compressed by heightMul).
  if (crouch && !isMoving) return { k: charKey + '_squat', flip: mvx < -0.01 };

  const suf = !isMoving || walkFrame === 0 ? '' : walkFrame === 1 ? '_a' : '_b';
  if (!isMoving) return { k: charKey + '_front', flip: false };

  const goBack  = mvz < -0.01;
  const goFront = mvz >  0.01;
  const goRight = mvx >  0.01;
  const goLeft  = mvx < -0.01;

  if (goBack && goRight) return { k: charKey + '_backq' + suf, flip: false };
  if (goBack && goLeft)  return { k: charKey + '_backq' + suf, flip: true  };
  if (goBack)            return { k: charKey + '_back'  + suf, flip: false };
  if (goRight && !goFront && !goBack) return { k: charKey + '_side' + suf, flip: false };
  if (goLeft  && !goFront && !goBack) return { k: charKey + '_side' + suf, flip: true  };
  return { k: charKey + '_front' + suf, flip: goLeft };
}

function drawChar(key, wx, wz, mvx, mvz, walkFrame, crouch, crouchLerp, idlePhase, gumSprKey, gumFade, sqBoost, isMoving) {
  const sp  = w2s(wx, wz);
  const s   = dScale(wz);
  const crouchBinary = crouchLerp > 0.5;

  // Resolve sprites — pass explicit isMoving so direction vector doesn't fake movement
  const { k: sprKey, flip: baseFlip } = getSpriteKey(key, mvx, mvz, walkFrame, crouchBinary, !!isMoving);
  const baseDir = sprKey.replace(/_a$|_b$/, '');
  let spr = SPR[sprKey] || SPR[baseDir] || SPR[key+'_front'] || IMG[sprKey] || IMG[key+'_front'];

  // Active gum/transition sequence key overrides base sprite entirely.
  // Shock sprites face right by default — allow direction-based flip.
  // All other sequence sprites are pre-oriented — suppress flip.
  let flip = baseFlip;
  if (gumSprKey) {
    spr  = SPR[gumSprKey] || IMG[gumSprKey] || spr;
    if (gumSprKey.indexOf('naomi_shock') < 0) flip = false;
  }

  const baseH = 360;
  // Standup frames during CROUCH_OUT (crouch=false) → full height.
  // Standup frames during CROUCH_IN (crouch=true) → scale with crouchLerp so no size pop at transition end.
  // Idle and shock frames always full standing height.
  const isStandingArt = gumSprKey && (
    (!crouch && gumSprKey.indexOf('standup') >= 0) ||
    gumSprKey.indexOf('naomi_shock') >= 0 ||
    (gumSprKey.indexOf('_idle_') >= 0 && gumSprKey.indexOf('squat') < 0)
  );
  const heightMul = lerp(1.09, 0.87, crouchLerp);
  const boost = (!gumSprKey && crouchBinary && sqBoost) ? sqBoost : 1.0;
  const sh = baseH * s * SQUISH * heightMul * boost;
  const ar = spr ? (spr.width / spr.height) : 0.5;
  const sw = sh * ar;

  const breathAmp   = crouchBinary ? 0.8 : 1.6;
  const breathFreq  = crouchBinary ? 0.45 : 0.85;
  const breathY     = isMoving ? 0 : Math.sin(idlePhase * breathFreq) * breathAmp;
  const breathScale = 1;

  cx.save();
  cx.translate(sp.x, sp.y + breathY);
  cx.scale(breathScale, breathScale);

  // Shadow
  cx.globalAlpha = 0.35;
  cx.fillStyle = '#000';
  cx.beginPath();
  cx.ellipse(0, 6, sw * 0.28, Math.max(2, sh * 0.05), 0, 0, Math.PI * 2);
  cx.fill();
  cx.globalAlpha = 1;

  if (flip) cx.scale(-1, 1);
  if (spr) {
    cx.drawImage(spr, -sw/2, -sh, sw, sh);
  } else {
    cx.globalAlpha = 0.85;
    cx.fillStyle = key === 'naomi' ? '#a08070' : '#804040';
    cx.fillRect(-sw/2, -sh, sw, sh);
  }

  cx.restore();
}

// Detect outline glow when player is spotted
function drawPlayerDetectGlow() {
  if (P.det < 0.15) return;
  const sp = { x: P.sx, y: P.sy };
  const s  = dScale(P.wz);
  const glow = cx.createRadialGradient(sp.x, sp.y - 40*s*SQUISH, 0,
                                        sp.x, sp.y, 60*s);
  glow.addColorStop(0, `rgba(255,200,0,${P.det * 0.55})`);
  glow.addColorStop(1, 'transparent');
  cx.save();
  cx.globalAlpha = P.det;
  cx.fillStyle = glow;
  cx.beginPath();
  cx.ellipse(sp.x, sp.y - 40*s*SQUISH, 35*s, 50*s*SQUISH, 0, 0, Math.PI*2);
  cx.fill();
  cx.restore();
}

function drawMinimap() {

  cx.globalAlpha = 0.4; cx.strokeStyle='#334'; cx.lineWidth=0.7;

function drawInteractPrompt() {
  if (DEMO_MODE) return;
  const dist = Math.hypot(P.wx - MISSION_DUMP.wx, P.wz - MISSION_DUMP.wz);
  INTERACT_BTN_POS.visible = false;

  if (dist > MISSION_DUMP.interactRange * 2.8) return;
  if (MISSION_DUMP.state === 'opening' || MISSION_DUMP.state === 'open_empty') return;

  const isKey = MISSION_DUMP.state === 'open_key';
  const ds    = w2s(MISSION_DUMP.wx, MISSION_DUMP.wz);
  const s     = dScale(MISSION_DUMP.wz);

  // Proximity fade — brighter the closer Naomi gets
  const proximity = 1 - clamp(dist / (MISSION_DUMP.interactRange * 2.8), 0, 1);
  const breathe   = 0.55 + Math.sin(pulse * 3.2) * 0.45;
  const alpha     = proximity * breathe;

  cx.save();

  // Ground pulse ring at the dumpster base — feels like the world is alive
  const col = isKey ? '#ffcc00' : '#00ffcc';
  const ringR = (40 + Math.sin(pulse * 3.2) * 8) * s;

  cx.globalAlpha = alpha * 0.6;
  cx.strokeStyle = col;
  cx.lineWidth   = 2.5 * s;
  cx.shadowBlur  = 18; cx.shadowColor = col;
  cx.beginPath();
  cx.ellipse(ds.x, ds.y, ringR, ringR * 0.28, 0, 0, Math.PI * 2);
  cx.stroke();

  // Second outer ring (expanding pulse effect)
  const ringR2 = ringR * (1.3 + Math.sin(pulse * 1.8 + 1) * 0.12);
  cx.globalAlpha = alpha * 0.25;
  cx.lineWidth = 1.2 * s;
  cx.beginPath();
  cx.ellipse(ds.x, ds.y, ringR2, ringR2 * 0.28, 0, 0, Math.PI * 2);
  cx.stroke();
  cx.shadowBlur = 0;

  cx.restore();

  // Wide tap zone — whole dumpster area is tappable, no separate button
  // Hit zone: dumpster body PLUS ring area below — both trigger the game
  const hitW = 180 * s, hitH = 160 * s;
  INTERACT_BTN_POS.x = ds.x - hitW/2;
  INTERACT_BTN_POS.y = ds.y - hitH;  // top of dumpster
  INTERACT_BTN_POS.w = hitW;
  INTERACT_BTN_POS.h = hitH + 50 * s;  // extend below ground to cover ring
  INTERACT_BTN_POS.visible = true;
}

  var bw = 52, bh = 52;

    var ar = bagImg.naturalWidth / bagImg.naturalHeight;
    bh = bw / ar;
    cx.globalAlpha = 0.92;
    cx.drawImage(bagImg, bx - bw, by, bw, bh);
  }
  // Item count badge
  if (itemCount > 0) {
    cx.globalAlpha = 1;
    cx.fillStyle = '#ff2d78';
    cx.beginPath(); cx.arc(bx - 6, by + 6, 9, 0, Math.PI * 2); cx.fill();
    cx.font = 'bold 10px monospace'; cx.fillStyle = '#fff'; cx.textAlign = 'center';
    cx.fillText(String(itemCount), bx - 6, by + 10);
  }
  // Drawer — show items when open
  if (INVENTORY.open && itemCount > 0) {
    var panW = 148, panH = itemCount * 56 + 12;
    var panX = bx - panW - 4, panY = by + bh + 6;
    // Panel background
    cx.globalAlpha = 0.94;
    cx.fillStyle = '#0a0816'; cx.strokeStyle = '#ff2d78'; cx.lineWidth = 1.2;
    cx.beginPath(); cx.roundRect(panX, panY, panW, panH, 10); cx.fill(); cx.stroke();

    INVENTORY.items.forEach(function(item, i) {
      var iy = panY + 8 + i * 56;
      // Item tile background
      cx.globalAlpha = 0.85;
      cx.fillStyle = item.id === 'key' ? 'rgba(40,30,0,0.8)' : 'rgba(0,20,40,0.8)';
      cx.strokeStyle = item.id === 'key' ? '#ffcc0066' : '#00ccff44';
      cx.lineWidth = 1;
      cx.beginPath(); cx.roundRect(panX + 6, iy, 136, 44, 7); cx.fill(); cx.stroke();

      // Game graphic — trash_key or trash_gun
      var sprKey = item.id === 'key' ? 'trash_key' : (item.id === 'gun' ? 'trash_gun' : null);
      var spr = sprKey ? (IMG[sprKey] || null) : null;
      if (spr && spr.naturalWidth) {
        var ar2 = spr.naturalWidth / spr.naturalHeight;
        var ih = 36, iw = ih * ar2;
        cx.globalAlpha = 1;
        cx.drawImage(spr, panX + 10, iy + 4, iw, ih);
        // Label beside image
        cx.font = 'bold 10px monospace';
        cx.fillStyle = item.id === 'key' ? '#ffcc00' : '#00ccff';
        cx.textAlign = 'left';
        cx.fillText(item.label.toUpperCase(), panX + 10 + iw + 6, iy + 18);
        cx.font = '9px monospace'; cx.fillStyle = '#888';
        var subLabel = item.id === 'key' ? 'UNLOCKS DOOR' : 'TAP TO EQUIP';
        cx.fillText(subLabel, panX + 10 + iw + 6, iy + 32);
        // Store gun tile hit area for tap detection
        if (item.id === 'gun') {
          GUN_ITEM_BTN.x = panX + 6; GUN_ITEM_BTN.y = iy;
          GUN_ITEM_BTN.w = 136; GUN_ITEM_BTN.h = 44;
          GUN_ITEM_BTN.visible = true;
        }
      } else {
        // Fallback text if image not loaded
        cx.globalAlpha = 1;
        cx.font = 'bold 11px monospace';
        cx.fillStyle = '#ccc'; cx.textAlign = 'left';
        cx.fillText(item.label, panX + 14, iy + 26);
      }
    });
  }
  cx.restore();
}

      // App icon background
      cx.globalAlpha = app.active ? 0.95 : 0.55;
      var grad = cx.createLinearGradient(ax, ay, ax+appSize, ay+appSize);
      grad.addColorStop(0, app.active ? app.color + 'aa' : '#1a1a2a');

function isPhoneBtn(x, y) {
  var b = PHONE_BTN;
  return x > b.x && x < b.x + b.w + 4 && y > b.y && y < b.y + b.h + 14;
}

function handlePhoneMenuTap(x, y) {
  if (!PHONE_OPEN) return false;
  var panX = PHONE_BTN.x, panY = PHONE_BTN.y + PHONE_BTN.h + 8;
  var appSize = 52, gap = 10, cols = 3;
  var apps = ['music', 'mute', 'soundcloud', 'map', 'settings'];
  for (var i = 0; i < apps.length; i++) {
    var col = i % cols, row = Math.floor(i / cols);
    var ax = panX + gap + col * (appSize + gap);
    var ay = panY + 36 + row * (appSize + gap + 16);
    if (x > ax && x < ax+appSize && y > ay && y < ay+appSize) {
      if (apps[i] === 'music' || apps[i] === 'mute') { toggleMute(); return true; }
      if (apps[i] === 'soundcloud') { openSoundCloud(); return true; }
      return true;
    }
  }
  // Absorb any tap inside the panel area
  if (x > panX && x < panX + 200 && y > panY) return true;
  return false;
}

function drawEmoteWheel() {
  if (DEMO_MODE) return;
  var bcx = GADGET_BTN.cx, bcy = GADGET_BTN.cy, br = GADGET_BTN.r;
  cx.save();
  // Shadow
  cx.globalAlpha=0.55; cx.fillStyle='#000';
  cx.beginPath(); cx.arc(bcx+1, bcy+4, br, 0, Math.PI*2); cx.fill();
  // Dark purple fill
  const bg = cx.createRadialGradient(bcx-br*0.3, bcy-br*0.3, 2, bcx, bcy, br);
  bg.addColorStop(0, '#2a0e44'); bg.addColorStop(1, '#0e0520');
  cx.globalAlpha=0.92; cx.fillStyle=bg;
  cx.beginPath(); cx.arc(bcx, bcy, br, 0, Math.PI*2); cx.fill();
  cx.globalAlpha=0.5; cx.strokeStyle='#8844cc'; cx.lineWidth=1.5;
  cx.beginPath(); cx.arc(bcx, bcy, br-1.5, 0, Math.PI*2); cx.stroke();
  // 5-dot pattern: center + 4 corners
  cx.globalAlpha=1; cx.fillStyle='#aa55ff';
  cx.beginPath(); cx.arc(bcx, bcy, 2.5, 0, Math.PI*2); cx.fill();
  for (var i=0; i<4; i++) {
    var a = (i/4)*Math.PI*2 + Math.PI/4;
    cx.beginPath(); cx.arc(bcx+Math.cos(a)*10, bcy+Math.sin(a)*10, 2.5, 0, Math.PI*2); cx.fill();
  }
  cx.font='bold 7px monospace'; cx.textAlign='center';
  cx.fillStyle='#aa55ff';
  cx.fillText('GADGET', bcx, bcy+br+12);
  if (!EMOTE_WHEEL.active) { cx.restore(); return; }

  // ── Full wheel ──────────────────────────────────────────────────────────────
  var wcx = EMOTE_WHEEL.cx, wcy = EMOTE_WHEEL.cy;
  var inner = EMOTE_WHEEL.innerR, outer = EMOTE_WHEEL.outerR;
  var slots = getEmoteSlots();

  // Backdrop
  cx.globalAlpha = 0.78;
  cx.fillStyle = '#080412';
  cx.beginPath(); cx.arc(wcx, wcy, outer+18, 0, Math.PI*2); cx.fill();
  cx.globalAlpha = 0.4;
  cx.strokeStyle = '#cc44ff'; cx.lineWidth = 1;
  cx.beginPath(); cx.arc(wcx, wcy, outer+18, 0, Math.PI*2); cx.stroke();

  for (var s=0; s<6; s++) {
    var startA = (s/6)*Math.PI*2 - Math.PI/2 - Math.PI/6;
    var endA   = startA + Math.PI/3;
    var midA   = startA + Math.PI/6;
    var slot   = slots[s];
    var isSelected = EMOTE_WHEEL.selectedSlot === s;
    var isEmpty = !slot.seq;

    // Segment fill
    cx.globalAlpha = isEmpty ? 0.25 : (isSelected ? 0.95 : 0.65);
    cx.fillStyle = isSelected ? slot.color : (isEmpty ? '#1a1a2a' : '#0d0818');
    cx.beginPath();
    cx.arc(wcx, wcy, outer, startA, endA);
    cx.arc(wcx, wcy, inner, endA, startA, true);
    cx.closePath(); cx.fill();

    // Segment border
    cx.globalAlpha = isEmpty ? 0.15 : (isSelected ? 1.0 : 0.4);
    cx.strokeStyle = slot.color; cx.lineWidth = isSelected ? 2.2 : 1.0;
    if (isSelected) { cx.shadowBlur = 12; cx.shadowColor = slot.color; }
    cx.beginPath();
    cx.arc(wcx, wcy, outer, startA, endA);
    cx.arc(wcx, wcy, inner, endA, startA, true);
    cx.closePath(); cx.stroke();
    cx.shadowBlur = 0;

    // Label
    var labelR = (inner + outer) / 2;
    var lx = wcx + Math.cos(midA) * labelR;
    var ly = wcy + Math.sin(midA) * labelR;
    cx.globalAlpha = isEmpty ? 0.25 : (isSelected ? 1.0 : 0.75);
    cx.font = isSelected ? 'bold 10px monospace' : 'bold 9px monospace';
    cx.fillStyle = isSelected ? '#fff' : slot.color;
    cx.textAlign = 'center';
    cx.fillText(slot.label, lx, ly + 3.5);
  }

  // Center circle — shows selected or instruction
  cx.globalAlpha = 0.9;
  cx.fillStyle = '#0d0818'; cx.strokeStyle = '#cc44ff'; cx.lineWidth = 1.5;
  cx.beginPath(); cx.arc(wcx, wcy, inner-4, 0, Math.PI*2); cx.fill(); cx.stroke();
  cx.font = 'bold 8px monospace'; cx.textAlign = 'center';
  if (EMOTE_WHEEL.selectedSlot >= 0 && slots[EMOTE_WHEEL.selectedSlot].seq) {
    cx.fillStyle = slots[EMOTE_WHEEL.selectedSlot].color;
    cx.fillText('GO', wcx, wcy+3);
  } else {
    cx.fillStyle = 'rgba(204,68,255,0.6)';
    cx.fillText('DRAG', wcx, wcy+3);
  }

  cx.restore();
}

function drawJoystick() {
  if (!JOY.on) return;
  cx.save();
  const ox = JOY.sx, oy = JOY.sy, r = JOY.r;
  // Base plate
  cx.globalAlpha = 0.30;
  cx.fillStyle = '#0d0d20';
  cx.beginPath(); cx.arc(ox, oy, r, 0, Math.PI*2); cx.fill();
  // Outer ring
  cx.globalAlpha = 0.55;
  cx.strokeStyle = '#3a3a6a'; cx.lineWidth = 3;
  cx.beginPath(); cx.arc(ox, oy, r, 0, Math.PI*2); cx.stroke();
  // Inner ring
  cx.globalAlpha = 0.2;
  cx.strokeStyle = '#8888aa'; cx.lineWidth = 1;
  cx.beginPath(); cx.arc(ox, oy, r * 0.55, 0, Math.PI*2); cx.stroke();
  // Direction marks (Xbox notches at N/S/E/W)
  cx.globalAlpha = 0.35;
  cx.strokeStyle = '#6666aa'; cx.lineWidth = 2;
  [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy]) => {
    cx.beginPath();
    cx.moveTo(ox + dx*(r-16), oy + dy*(r-16));
    cx.lineTo(ox + dx*(r-6),  oy + dy*(r-6));
    cx.stroke();
  });
  // Thumbstick
  const kx = ox + JOY.dx*r, ky = oy + JOY.dy*r;
  const kr = 30;
  // Stick shadow
  cx.globalAlpha = 0.45;
  cx.fillStyle = '#000';
  cx.beginPath(); cx.arc(kx+2, ky+4, kr, 0, Math.PI*2); cx.fill();
  // Stick body gradient
  const sg = cx.createRadialGradient(kx-kr*0.3, ky-kr*0.3, 1, kx, ky, kr);
  sg.addColorStop(0,   '#7070c0');
  sg.addColorStop(0.45,'#282850');
  sg.addColorStop(1,   '#10101e');
  cx.globalAlpha = 0.92;
  cx.fillStyle = sg;
  cx.beginPath(); cx.arc(kx, ky, kr, 0, Math.PI*2); cx.fill();
  // Stick rim
  cx.globalAlpha = 0.6;
  cx.strokeStyle = '#5555aa'; cx.lineWidth = 2;
  cx.beginPath(); cx.arc(kx, ky, kr, 0, Math.PI*2); cx.stroke();
  // Specular glint
  cx.globalAlpha = 0.3;
  cx.fillStyle = '#aaaaff';
  cx.beginPath(); cx.ellipse(kx-kr*0.22, ky-kr*0.28, kr*0.35, kr*0.18, -0.5, 0, Math.PI*2); cx.fill();
  cx.restore();
}

// ─── Intro sequence ───────────────────────────────────────────────────────────
function drawIntro() {
  // Black base
  cx.fillStyle = '#000';
  cx.fillRect(0, 0, VW, VH);

  // Compute master alpha for fade in/out
  let alpha;
  if (introTimer < INTRO_IN) {
    alpha = introTimer / INTRO_IN;
  } else if (introTimer < INTRO_IN + INTRO_HOLD) {
    alpha = 1;
  } else {
    alpha = 1 - (introTimer - INTRO_IN - INTRO_HOLD) / INTRO_OUT;
  }
  alpha = Math.max(0, Math.min(1, alpha));

  cx.save();

  // ── Base image ──
  if (IMG['intro']) {
    cx.globalAlpha = alpha;
    cx.drawImage(IMG['intro'], 0, 0, VW, VH);
  }

  // ── Animated orange glow (right side) ──
  const glowPulse = 0.06 + Math.sin(pulse * 1.4) * 0.025;
  cx.globalAlpha = alpha * glowPulse * 4;
  const og = cx.createRadialGradient(VW*0.82, VH*0.62, 0, VW*0.82, VH*0.55, VW*0.5);
  og.addColorStop(0, '#c84010');
  og.addColorStop(0.5,'#6a1c00');
  og.addColorStop(1, 'transparent');
  cx.globalCompositeOperation = 'screen';
  cx.fillStyle = og;
  cx.fillRect(0, 0, VW, VH);

  // ── Animated teal glow (left side) ──
  cx.globalAlpha = alpha * (0.04 + Math.sin(pulse * 1.1 + 1) * 0.02) * 3;
  const tg = cx.createRadialGradient(VW*0.14, VH*0.40, 0, VW*0.14, VH*0.40, VW*0.45);
  tg.addColorStop(0, '#1a8090');
  tg.addColorStop(0.5,'#0a3a44');
  tg.addColorStop(1, 'transparent');
  cx.fillStyle = tg;
  cx.fillRect(0, 0, VW, VH);

  // ── Film grain overlay ──
  if (!grainCv) buildGrain();
  cx.globalAlpha = alpha * 0.18;
  cx.globalCompositeOperation = 'overlay';
  cx.drawImage(grainCv, 0, 0, VW, VH);

  // ── Horizontal scan-line shimmer ──
  cx.globalCompositeOperation = 'source-over';
  cx.globalAlpha = alpha * 0.03;
  cx.fillStyle = '#fff';
  const lineY = ((pulse * 60) % VH);
  cx.fillRect(0, lineY, VW, 2);

  // ── Vignette ──
  cx.globalAlpha = alpha * 0.55;
  cx.globalCompositeOperation = 'source-over';
  const vg = cx.createRadialGradient(VW/2,VH/2, VH*0.2, VW/2,VH/2, VH*0.85);
  vg.addColorStop(0, 'transparent');
  vg.addColorStop(1, '#000');
  cx.fillStyle = vg;
  cx.fillRect(0, 0, VW, VH);

  cx.restore();

  // ── Skip hint (fades in after 0.6s) ──
  if (introTimer > 0.6) {
    const skipAlpha = Math.min(1, (introTimer - 0.6) / 0.5) * alpha;
    cx.save();
    cx.globalAlpha = skipAlpha * (0.28 + Math.sin(pulse * 2.5) * 0.14);
    cx.font = '10px monospace';
    cx.fillStyle = '#aaa';
    cx.textAlign = 'right';
    cx.fillText('TAP TO SKIP', VW - 18, VH - 14);
    cx.restore();
  }
}

function drawDialogue() {
  if (dlgIdx >= DLG.length) return;
  const d = DLG[dlgIdx];

  const FONT_TITLE = "900 18px 'Bangers', Impact, sans-serif";
  const FONT_HINT  = "italic 11px 'Comic Neue', 'Comic Sans MS', Arial, sans-serif";

  const panelY = Math.round(VH * 0.46);
  const panelH = VH - panelY;
  const portW  = Math.round(VW * 0.29);

  // ── Scene — upper half visible, bottom darkens into panel ──
  drawBg(0);
  cx.save();
  const fadeG = cx.createLinearGradient(0, panelY - 60, 0, panelY + 10);
  fadeG.addColorStop(0, 'transparent');
  fadeG.addColorStop(1, 'rgba(0,0,0,0.92)');
  cx.fillStyle = fadeG;
  cx.fillRect(0, panelY - 60, VW, 70);
  cx.restore();

  // ── Panel base — deep black ─────────────────────────────────
  cx.fillStyle = '#050209';
  cx.fillRect(0, panelY, VW, panelH);

  // ── Screen-tone diagonal lines (classic manga/GN texture) ──
  cx.save();
  cx.strokeStyle = d.col === '#00ffcc' ? '#06141a' : '#180610';
  cx.lineWidth = 0.7;
  cx.globalAlpha = 0.6;
  for (let x = -panelH; x < VW + panelH; x += 7) {
    cx.beginPath();
    cx.moveTo(x, panelY);
    cx.lineTo(x + panelH, VH);
    cx.stroke();
  }
  cx.restore();

  // ── Heavy top ink border ────────────────────────────────────
  cx.fillStyle = '#000';
  cx.fillRect(0, panelY - 7, VW, 8);
  cx.fillStyle = d.col;
  cx.fillRect(0, panelY - 1, VW, 4);

  // ── PORTRAIT PANEL ─────────────────────────────────────────
  cx.save();
  cx.beginPath();
  cx.rect(0, panelY, portW, panelH);
  cx.clip();

  cx.fillStyle = '#000';
  cx.fillRect(0, panelY, portW, panelH);

  const portrait = IMG[d.portrait];
  if (portrait) {
    const imgAR = portrait.naturalWidth / portrait.naturalHeight;
    const panAR = portW / panelH;
    let sx=0, sy=0, sw=portrait.naturalWidth, sh=portrait.naturalHeight;
    if (imgAR > panAR) {
      sw = portrait.naturalHeight * panAR;
      sx = (portrait.naturalWidth - sw) * 0.38;
    } else {
      sh = portrait.naturalWidth / panAR;
      sy = (portrait.naturalHeight - sh) * 0.08;
    }
    cx.drawImage(portrait, sx, sy, sw, sh, 0, panelY, portW, panelH);
  }

  // Right-edge fade into panel
  const fadeR = cx.createLinearGradient(portW - 45, 0, portW, 0);
  fadeR.addColorStop(0, 'transparent');
  fadeR.addColorStop(1, '#050209');
  cx.fillStyle = fadeR;
  cx.fillRect(portW - 45, panelY, 45, panelH);
  cx.restore();

  // Portrait divider — thick ink
  cx.fillStyle = '#000';
  cx.fillRect(portW, panelY, 5, panelH);
  cx.fillStyle = d.col;
  cx.fillRect(portW + 5, panelY, 2.5, panelH);

  // ── SPEAKER NAME — Bangers font, bottom of portrait ────────
  cx.save();
  const nameBarH = 28;
  cx.fillStyle = d.col;
  cx.fillRect(0, VH - nameBarH, portW, nameBarH);
  // Diagonal slash accent
  cx.fillStyle = 'rgba(0,0,0,0.25)';
  cx.beginPath();
  cx.moveTo(portW - 40, VH - nameBarH);
  cx.lineTo(portW, VH - nameBarH);
  cx.lineTo(portW - 14, VH);
  cx.lineTo(portW - 54, VH);
  cx.closePath();
  cx.fill();
  cx.font = FONT_TITLE;
  cx.textAlign = 'center';
  cx.letterSpacing = '3px';
  cx.fillStyle = '#000';
  cx.fillText(d.who, portW / 2 + 1, VH - 9);
  cx.restore();

  // ── SPEECH BUBBLE — cream white, black ink, proper tail ────
  cx.save();
  const bx  = portW + 18;
  const by  = panelY + 12;
  const bw  = VW - bx - 14;
  const bh  = panelH - 44;
  const rad = 12;

  // Hard drop shadow
  cx.fillStyle = 'rgba(0,0,0,0.55)';
  cx.beginPath();
  cx.roundRect(bx + 5, by + 5, bw, bh, rad);
  cx.fill();

  // Cream bubble fill
  cx.fillStyle = '#fdfbf0';
  cx.beginPath();
  // Top edge
  cx.moveTo(bx + rad, by);
  cx.lineTo(bx + bw - rad, by);
  cx.arcTo(bx+bw, by,      bx+bw, by+rad,   rad);
  cx.lineTo(bx+bw, by+bh-rad);
  cx.arcTo(bx+bw, by+bh,   bx+bw-rad, by+bh, rad);
  cx.lineTo(bx+rad, by+bh);
  cx.arcTo(bx, by+bh,      bx, by+bh-rad,   rad);
  // Left side with tail
  cx.lineTo(bx, by + 52);
  cx.lineTo(bx - 16, by + 38);   // tail tip
  cx.lineTo(bx, by + 24);
  cx.lineTo(bx, by + rad);
  cx.arcTo(bx, by, bx+rad, by, rad);
  cx.closePath();
  cx.fill();

  // Ink outline — thick
  cx.strokeStyle = '#0a0a0a';
  cx.lineWidth = 3;
  cx.stroke();

  // Inner subtle texture lines (graphic novel depth)
  cx.strokeStyle = 'rgba(0,0,0,0.06)';
  cx.lineWidth = 1;
  for (let ty = by + 18; ty < by + bh - 8; ty += 8) {
    cx.beginPath();
    cx.moveTo(bx + 10, ty);
    cx.lineTo(bx + bw - 10, ty);
    cx.stroke();
  }

  // ── Dialogue text — auto-size to fill bubble ──
  cx.fillStyle = '#0a0a0a';
  cx.textAlign = 'left';
  cx.shadowColor = 'transparent';
  const pad = 20;
  const maxW = bw - pad * 2;
  const bubbleH = bh - 52;  // usable height inside bubble

  // Find largest font size where text wraps and fits vertically
  let fontSize = 28, lineH, lines;
  while (fontSize >= 13) {
    cx.font = `900 ${fontSize}px 'Bangers', Impact, sans-serif`;
    lineH = fontSize * 1.22;
    lines = [];
    let cur = '';
    for (const w of d.txt.split(' ')) {
      const test = cur + w + ' ';
      if (cx.measureText(test).width > maxW && cur) {
        lines.push(cur.trim()); cur = w + ' ';
      } else cur = test;
    }
    lines.push(cur.trim());
    if (lines.length * lineH <= bubbleH) break;
    fontSize -= 1;
  }

  // Vertically center the text block in the bubble
  const totalH = lines.length * lineH;
  let ly = by + 16 + (bubbleH - totalH) / 2 + lineH * 0.85;
  cx.font = `900 ${fontSize}px 'Bangers', Impact, sans-serif`;
  for (const ln of lines) {
    cx.fillText(ln, bx + pad, ly);
    ly += lineH;
  }
  cx.restore();

  // ── CONTINUE HINT — italic, bottom right ───────────────────
  cx.save();
  cx.globalAlpha = 0.45 + Math.sin(pulse * 3.5) * 0.42;
  cx.font = FONT_HINT;
  cx.fillStyle = d.col;
  cx.textAlign = 'right';
  cx.fillText('tap to continue ▶', VW - 14, VH - 8);
  cx.restore();

  // ── PROGRESS DOTS ──────────────────────────────────────────
  cx.save();
  const dotCX = portW / 2;
  for (let i = 0; i < DLG.length; i++) {
    const active = i === dlgIdx;
    cx.fillStyle   = active ? d.col : 'rgba(255,255,255,0.15)';
    cx.strokeStyle = d.col;
    cx.lineWidth   = 1.5;
    cx.beginPath();
    cx.arc(dotCX + (i - 1) * 18, VH - nameBarH - 12, active ? 5.5 : 3.5, 0, Math.PI*2);
    cx.fill(); cx.stroke();
  }
  cx.restore();
}


function drawWinDlg() {
  if (winDlgIdx >= WIN_DLG.length) return;
  const d = WIN_DLG[winDlgIdx];

  // Draw dialogue using win data — inline to avoid array mutation
  const savedIdx = dlgIdx;
  dlgIdx = winDlgIdx;
  // Temporarily patch DLG entries
  const origLen = DLG.length;
  WIN_DLG.forEach((l, i) => { DLG[i] = l; });
  DLG.length = WIN_DLG.length;

  drawBg(0.72);
  drawDialogue();

  // Restore DLG
  DLG.length = origLen;
  [
    { who:'NAOMI',  col:'#00ffcc', portrait:'dlg_naomi1',  txt:'Sierra, we need to move faster. If my dad finds out I still have that notebook, it\'s over for both of us.' },
    { who:'SIERRA', col:'#ff2d78', portrait:'dlg_sierra1', txt:'Chill, Naomi. We\'re moving. Just keep your eyes on the path and stop looking back. You\'re drawing attention.' },
    { who:'NAOMI',  col:'#00ffcc', portrait:'dlg_naomi2',  txt:'This city is like a museum of people acting. I\'m done playing my part.' },
  ].forEach((l, i) => { DLG[i] = l; });
  dlgIdx = savedIdx;
}

function drawEndCard() {
  // Black base
  cx.fillStyle = '#000';
  cx.fillRect(0, 0, VW, VH);

  // Intro image as base with heavy overlay
  if (IMG['intro']) {
    cx.save();
    const t = Math.min(endTimer / 1.2, 1);
    cx.globalAlpha = t;
    cx.drawImage(IMG['intro'], 0, 0, VW, VH);
    cx.globalAlpha = t * 0.55;
    cx.fillStyle = '#000';
    cx.fillRect(0, 0, VW, VH);
    cx.restore();
  }

  // Season 2 tag
  const t = Math.min(endTimer / 1.8, 1);
  cx.save();
  cx.globalAlpha = t;
  cx.font = "12px 'Bangers', Impact, sans-serif";
  cx.fillStyle = '#c86030';
  cx.letterSpacing = '4px';
  cx.textAlign = 'center';
  cx.fillText('SEASON TWO  /  COMING SOON', VW/2, VH * 0.28);

  // TWISTED title
  cx.globalAlpha = Math.min((endTimer - 0.3) / 1.2, 1) * 1;
  cx.shadowBlur = 40; cx.shadowColor = '#c86030';
  cx.font = `bold ${70 + Math.sin(pulse*1.5)*1.5}px serif`;
  cx.fillStyle = '#fff';
  cx.fillText('twisted', VW/2, VH * 0.52);

  // Tagline
  cx.shadowBlur = 0;
  cx.globalAlpha = Math.min((endTimer - 0.8) / 1.0, 1);
  cx.font = "italic 18px 'Comic Neue', 'Comic Sans MS', serif";
  cx.fillStyle = '#d4d4d4';
  cx.letterSpacing = '1px';
  cx.fillText('twisted minds together', VW/2, VH * 0.65);

  // Notebook hint line — the real hook
  cx.globalAlpha = Math.min((endTimer - 1.4) / 1.2, 1);
  cx.font = "13px 'Comic Neue', 'Comic Sans MS', monospace";
  cx.fillStyle = '#00ffcc';
  cx.fillText('"The notebook changes everything."', VW/2, VH * 0.76);

  // Tap to replay
  cx.globalAlpha = (Math.min((endTimer - 2.0) / 1.0, 1)) * (0.4 + Math.sin(pulse*3)*0.4);
  cx.font = "italic 11px 'Comic Neue', monospace";
  cx.fillStyle = '#888';
  cx.fillText('tap to play again', VW/2, VH * 0.91);

  cx.restore();
}

function drawOverlay(col, title, sub, hint) {
  cx.save();
  cx.fillStyle=col; cx.fillRect(0,0,VW,VH);
  cx.shadowBlur=35; cx.shadowColor=title.startsWith('C')?'#ff0000':'#00ff88';
  cx.font='bold 52px serif'; cx.fillStyle='#fff'; cx.textAlign='center';
  cx.fillText(title, VW/2, VH*0.38);
  cx.shadowBlur=0; cx.font='15px monospace'; cx.fillStyle='#ccc';
  cx.fillText(sub, VW/2, VH*0.54);
  cx.globalAlpha=0.5+Math.sin(pulse*3)*0.5;
  cx.font='14px monospace'; cx.fillStyle='#fff';
  cx.fillText(hint, VW/2, VH*0.72);
  cx.restore();
}

// ─── Main render loop ─────────────────────────────────────────────────────────
function render(ts) {
  try {
    update(ts);
    cx.clearRect(0, 0, cv.width, cv.height);
    // Fill letterbox bars with extended scene edges (raw canvas coords, before game transform)
    drawExtendedBg();
    cx.save();
    cx.translate(offX, offY);
    cx.scale(scale, scale);

  switch (phase) {
    case PH.INSTALL:
      drawInstall();
      break;

    case PH.INTRO: {
      // Loading screen — still image fills canvas while videos cache
      const ls = IMG['loading_screen'];
      if (ls) {
        cx.drawImage(ls, 0, 0, VW, VH);
      } else {
        cx.fillStyle = '#000'; cx.fillRect(0, 0, VW, VH);
      }
      // Dark gradient overlay so text reads clearly
      const ld = cx.createLinearGradient(0, VH*0.7, 0, VH);
      ld.addColorStop(0, 'transparent'); ld.addColorStop(1, 'rgba(0,0,0,0.75)');
      cx.fillStyle = ld; cx.fillRect(0, 0, VW, VH);

      // TWISTED title
      cx.save();
      cx.shadowBlur = 28; cx.shadowColor = '#ff2d78';
      cx.font = "bold 54px 'Bangers', Impact, serif";
      cx.textAlign = 'center'; cx.fillStyle = '#ff2d78';
      cx.fillText('TWISTED', VW/2, VH * 0.82);
      cx.shadowBlur = 0;
      cx.font = "bold 16px monospace"; cx.fillStyle = '#00ffcc';
      cx.fillText('MIAMI UNDERWORLD', VW/2, VH * 0.89);

      // Show loading progress or tap prompt once ready
      cx.font = "12px monospace"; cx.textAlign = 'center';
      if (videosReady || loadingElapsed > 1.5) {
        // Ready — pulse tap prompt
        cx.globalAlpha = 0.5 + Math.sin(pulse * 3) * 0.4;
        cx.fillStyle = '#fff';
        cx.fillText('TAP TO PLAY', VW/2, VH * 0.95);
      } else {
        const pct = Math.min(100, Math.round((videosLoaded / PRELOAD_VIDEOS.length) * 100));
        const dots = '.'.repeat(loadingDots + 1);
        cx.globalAlpha = 0.55;
        cx.fillStyle = '#fff';
        cx.fillText('Loading' + dots + '  ' + pct + '%', VW/2, VH * 0.95);
      }
      cx.restore();
      break;
    }

    case PH.TITLE:
      drawTitle();
      break;

    case PH.DLG:
      drawDialogue();
      break;

    case PH.CUTSCENE:
      // Video plays underneath — canvas is transparent, just draw skip hint
      cx.save();
      cx.globalAlpha = 0.3 + Math.sin(pulse * 2.5) * 0.18;
      cx.font = "italic 11px 'Comic Neue', monospace";
      cx.fillStyle = '#fff';
      cx.textAlign = 'right';
      cx.fillText('tap to skip ▶', VW - 16, VH - 14);
      cx.restore();
      break;

    case PH.CROSSFADE: {
      // Render full game scene — canvas fades in as video fades out beneath
      const cfAlpha = Math.min(1, crossfadeTimer / CROSSFADE_DUR);
      cx.save(); cx.globalAlpha = cfAlpha;
      drawBg();
      drawSpotlight();
      drawCar();
      drawEntities();
      drawWinGlow();
      cx.restore();
      cx.save(); cx.globalAlpha = cfAlpha;
      drawMinimap();
      drawHUD();
      cx.restore();
      break;
    }

    case PH.PLAY:
      drawBg();
      drawClouds();
      drawBirds();
      drawRats();
      drawSpotlight();
      drawCar();
      drawEntities();    // bins + characters depth-sorted together
      drawFgBox();       // near-camera foreground crates — in front of characters
      drawWinGlow();
      // Spotted flash
      if (catchFlash > 0) {
        cx.save();
        cx.globalAlpha=catchFlash*0.55; cx.fillStyle='#ff0000'; cx.fillRect(0,0,VW,VH);
        cx.globalAlpha=catchFlash; cx.shadowBlur=20; cx.shadowColor='#ff0000';
        cx.font='bold 44px serif'; cx.fillStyle='#fff'; cx.textAlign='center';
        cx.fillText('SPOTTED!', VW/2, VH/2);
        cx.restore();
      }
      drawMinimap();
      drawHUD();
      drawInteractPrompt();
      drawInventoryBag();
      drawTargetIcon();
      drawEmoteWheel();
      drawPhoneMenu();
      drawJoystick();
      break;

    case PH.CAUGHT:
      // Caught video plays above canvas — keep canvas black
      cx.fillStyle = '#000'; cx.fillRect(0, 0, VW, VH);
      break;

    case PH.WIN:
      // Brief flash before win dialogue
      drawBg(0.3);
      cx.save();
      cx.globalAlpha = Math.max(0, 1 - winFlashTimer * 1.5);
      cx.fillStyle = '#00ff8844';
      cx.fillRect(0, 0, VW, VH);
      cx.shadowBlur = 30; cx.shadowColor = '#00ff88';
      cx.font = "bold 38px 'Bangers', Impact, serif";
      cx.fillStyle = '#00ff88'; cx.textAlign = 'center';
      cx.fillText('NOTEBOOK SECURED', VW/2, VH/2);
      cx.restore();
      break;

    case PH.WIN_DLG:
      drawWinDlg();
      break;

    case PH.END:
      drawEndCard();
      break;
  }

  cx.restore();
  } catch(e) {
    console.error('RENDER ERROR:', e);
    cx.restore();
  }
  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
